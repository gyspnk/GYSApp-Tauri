<!doctype html>
<html lang="id" data-boot="pending">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffffff" />
    <script vite-ignore src="%BASE_URL%startup.js"></script>
    <!-- The fonts are referenced from CSS, so Vite emits them with content
         hashes; a preload with the source path cannot be rewritten and 404s on
         the deployed site, so the stylesheet discovery is the only request. -->
    <!-- The home hero comes from this 8 KiB shelf: starting it with the head
         saves a request round trip after React boots (LCP 5,4 dtk hosted). -->
    <link
      rel="preload"
      href="%BASE_URL%offline/sauh.json"
      as="fetch"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="/src/startup.css" />
    <meta name="description" content="GYSApp — Gereja Yesus Sejati" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%BASE_URL%assets/gys-mark.svg"
    />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link
      rel="preconnect"
      href="https://tjcorguploads.s3.amazonaws.com"
      crossorigin
    />
    <title>GYSApp</title>
  </head>
  <body>
    <div
      id="boot-splash"
      class="shell-startup"
      role="status"
      aria-label="GYSApp"
    >
      <div class="shell-startup-dove-wrap" aria-hidden="true">
        <span class="shell-startup-halo"></span>
        <svg
          class="shell-startup-dove"
          viewBox="0 0 120 96"
          width="92"
          height="74"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g class="dove-wing-left">
            <path
              d="M58 50C44 36 25 22 10 18C18 33 27 45 43 52C48 54 54 54 58 50Z"
              fill="currentColor"
              opacity="0.88"
            />
            <path
              d="M54 52C38 46 22 40 12 36C21 47 32 55 46 57C50 57 53 55 54 52Z"
              fill="currentColor"
              opacity="0.62"
            />
          </g>
          <g class="dove-wing-right">
            <path
              d="M62 50C76 36 95 22 110 18C102 33 93 45 77 52C72 54 66 54 62 50Z"
              fill="currentColor"
              opacity="0.96"
            />
            <path
              d="M66 52C82 46 98 40 108 36C99 47 88 55 74 57C70 57 67 55 66 52Z"
              fill="currentColor"
              opacity="0.68"
            />
          </g>
          <path
            d="M60 36C64 36 67 39 67 44C67 50 64 58 60 66C56 58 53 50 53 44C53 39 56 36 60 36Z"
            fill="currentColor"
          />
          <path
            d="M54 66L60 78L66 66C63 68 57 68 54 66Z"
            fill="currentColor"
            opacity="0.78"
          />
        </svg>
      </div>
      <img
        src="%BASE_URL%assets/gys-logo.png"
        alt="Gereja Yesus Sejati"
        width="240"
        height="31"
      />
      <span class="shell-startup-track"><span></span></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
