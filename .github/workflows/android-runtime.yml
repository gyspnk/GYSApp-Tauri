name: Android 17 runtime

on:
  workflow_call:
    inputs:
      apk_run_id:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      apk_run_id:
        description: "Native Android APK workflow run ID containing the verified ARM64 artifact"
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_AVD_HOME: /tmp/gys-android-avd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: gysapp-android-arm64-${{ inputs.apk_run_id }}
          path: android-artifacts
          run-id: ${{ inputs.apk_run_id }}
          github-token: ${{ github.token }}
      - name: Enable KVM and install Android 17
        run: |
          mkdir -p "$ANDROID_AVD_HOME"
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager "emulator" "system-images;android-37.0;google_apis;x86_64"
          printf 'no\n' | avdmanager create avd --force --name gys-api37 --package "system-images;android-37.0;google_apis;x86_64" --device pixel_2
      - name: Exercise packaged APK on Android 17
        run: |
          mkdir -p android-qa
          sha256sum -c android-artifacts/SHA256SUMS-android.txt
          printf 'APK source commit: '
          cat android-artifacts/commit.txt
          trap 'result=$?; if [ "$result" -ne 0 ]; then cat android-qa/emulator.log; fi' EXIT
          "$ANDROID_HOME/emulator/emulator" -avd gys-api37 -accel on -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader -memory 4096 > android-qa/emulator.log 2>&1 &
          emulator_pid=$!
          sleep 3
          if ! kill -0 "$emulator_pid" 2>/dev/null; then exit 1; fi
          python3 scripts/android-runtime-smoke.py --apk android-artifacts/GYSApp-0.1.0-android-arm64-preview.apk --output android-qa
      - name: Upload native screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-17-runtime-${{ github.run_id }}
          path: android-qa/
          if-no-files-found: warn
