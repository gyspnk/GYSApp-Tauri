name: Agent format backup RED

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-format-backup-red.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format the RED regression only
        run: pnpm exec prettier --write apps/web/e2e/settings-data-integrity.spec.ts
      - name: Commit formatted regression and remove this temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-format-backup-red.yml
          git add apps/web/e2e/settings-data-integrity.spec.ts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: format backup portability regression"
          git push origin HEAD:audit/parity-ui-tts-20260911
