name: Agent portable backup policy fix

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-backup-policy-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add portable backup policy
        shell: bash
        run: |
          cat > apps/web/src/backup-settings.ts <<'EOF'
          type PortableStorage = Pick<
            Storage,
            "getItem" | "setItem" | "length" | "key"
          >;

          const PORTABLE_BACKUP_KEYS = new Set([
            "gys-locale",
            "gys-theme",
            "gys-shell-settings-v1",
            "gys-activity-v1",
            "gys-favorites-v1",
            "gys-literature-progress-v2",
            "gys-bible-book",
            "gys-bible-chapter",
            "gys-bible-version-v1",
            "gys-bible-last-reading",
            "gys-bible-bookmarks",
            "gys-bible-notes-v1",
            "gys-bible-highlights-v1",
            "gys-bible-search-history-v1",
            "gys-bible-split-v1",
            "gys-bible-split-ratio-v1",
            "gys-daily-sauh-mode-v1",
            "gys-sidebar-collapsed-v1",
            "gys-media-minimized",
            "gys-media-position-v1",
            "gys-midi-preferences-v1",
            "gys-hymn-typography-v1",
            "gys-speech-voice-v1",
            "gys-speech-rate-v1",
            "gys-speech-engine-v1",
            "gys-report-draft",
            "gys-reminder-time-v1",
            "gys-midi-playlist-v1",
            "gys-hymn-view-mode-v1",
            "gys-hymn-chord-visibility-v1",
            "gys-accent-color",
            "gys-bible-secondary-version",
            "gys-bible-split-sync-scroll-v1",
            "gys-bible-typography-v1",
            "gys-chord-ui-prefs",
            "gys-hymn-natural-chords",
            "gys-hymn-view-scope",
            "gys-hymn-viewer-prefs-v1",
            "gys-kidung-active-playlist",
            "gys-kidung-playlists-v1",
            "gys-lyrics-font-size",
            "gys-lyrics-header-collapsed",
            "gys-lyrics-line-spacing",
            "gys-lyrics-show-chords",
            "gys-hymn-accidental",
            "gys-speech-pitch-v1",
            "gys-speech-volume-v1",
          ]);

          const PORTABLE_BACKUP_PREFIXES = [
            "gys-pdf-page:",
            "gys-pdf-layout:",
            "gys-faith-pdf-",
            "gys-faith-note-",
          ];

          export function isPortableBackupSetting(key: string): boolean {
            return (
              PORTABLE_BACKUP_KEYS.has(key) ||
              PORTABLE_BACKUP_PREFIXES.some((prefix) => key.startsWith(prefix))
            );
          }

          export function collectPortableBackupSettings(
            storage: PortableStorage = localStorage,
          ): Record<string, string> {
            const keys = new Set(PORTABLE_BACKUP_KEYS);
            for (let index = 0; index < storage.length; index += 1) {
              const key = storage.key(index);
              if (key && isPortableBackupSetting(key)) keys.add(key);
            }
            return Object.fromEntries(
              [...keys].flatMap((key) => {
                const value = storage.getItem(key);
                return value === null ? [] : [[key, value]];
              }),
            );
          }

          export function restorePortableBackupSettings(
            settings: unknown,
            storage: PortableStorage = localStorage,
          ): number {
            if (!settings || typeof settings !== "object" || Array.isArray(settings))
              throw new Error("settings missing");
            let restored = 0;
            for (const [key, value] of Object.entries(settings)) {
              if (!isPortableBackupSetting(key) || typeof value !== "string") continue;
              storage.setItem(key, value);
              restored += 1;
            }
            return restored;
          }
          EOF
          cat > apps/web/src/backup-settings.test.ts <<'EOF'
          import { describe, expect, it } from "vitest";
          import {
            collectPortableBackupSettings,
            isPortableBackupSetting,
            restorePortableBackupSettings,
          } from "./backup-settings.js";

          function memoryStorage(initial: Record<string, string> = {}): Storage {
            const values = new Map(Object.entries(initial));
            return {
              get length() {
                return values.size;
              },
              key: (index: number) => [...values.keys()][index] ?? null,
              getItem: (key: string) => values.get(key) ?? null,
              setItem: (key: string, value: string) => values.set(key, value),
            } as unknown as Storage;
          }

          describe("portable backup settings", () => {
            it("collects durable settings and dynamic reading data only", () => {
              const storage = memoryStorage({
                "gys-accent-color": "#355c9a",
                "gys-faith-note-1": "portable note",
                "gys-asset-index-v1": "cache pointer",
                "gys-egys-session-v1": "private session",
                "gys-unlisted-device-state": "private state",
              });

              expect(collectPortableBackupSettings(storage)).toEqual({
                "gys-accent-color": "#355c9a",
                "gys-faith-note-1": "portable note",
              });
              expect(isPortableBackupSetting("gys-asset-index-v1")).toBe(false);
              expect(isPortableBackupSetting("gys-active-asset-manifest-v1")).toBe(
                false,
              );
              expect(isPortableBackupSetting("gys-chord-cache-index-v1")).toBe(
                false,
              );
            });

            it("restores only explicitly portable settings from a valid payload", () => {
              const storage = memoryStorage();
              const restored = restorePortableBackupSettings(
                {
                  "gys-accent-color": "#355c9a",
                  "gys-faith-note-1": "portable note",
                  "gys-live-v1-token": "injected token",
                  "gys-egys-session-v1": "injected session",
                  "gys-custom-edge-endpoint-v1": "https://injected.invalid/tts",
                  "gys-asset-index-v1": "cache pointer",
                  "gys-unlisted-device-state": "private state",
                },
                storage,
              );

              expect(restored).toBe(2);
              expect(storage.getItem("gys-accent-color")).toBe("#355c9a");
              expect(storage.getItem("gys-faith-note-1")).toBe("portable note");
              expect(storage.getItem("gys-live-v1-token")).toBeNull();
              expect(storage.getItem("gys-egys-session-v1")).toBeNull();
              expect(storage.getItem("gys-custom-edge-endpoint-v1")).toBeNull();
              expect(storage.getItem("gys-asset-index-v1")).toBeNull();
              expect(storage.getItem("gys-unlisted-device-state")).toBeNull();
            });

            it("rejects malformed settings payloads", () => {
              expect(() => restorePortableBackupSettings(null, memoryStorage())).toThrow(
                "settings missing",
              );
              expect(() => restorePortableBackupSettings([], memoryStorage())).toThrow(
                "settings missing",
              );
            });
          });
          EOF
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/more.tsx")
          text = path.read_text()

          domain_import = '''import {
            decryptBackupV2,
            encryptBackupV2,
            importLegacyGysbk,
          } from "@gys/domain";
          '''
          backup_import = '''import {
            collectPortableBackupSettings,
            restorePortableBackupSettings,
          } from "./backup-settings.js";
          '''
          if domain_import not in text:
              raise SystemExit("domain import anchor missing")
          text = text.replace(domain_import, domain_import + backup_import, 1)

          start = text.find("\nconst BACKUP_STORAGE_KEYS = [")
          end = text.find("\nfunction downloadBackup", start)
          if start < 0 or end < 0:
              raise SystemExit("backup policy block anchor missing")
          text = text[:start] + text[end:]

          old_export = "{ settings: collectBackupSettings() },"
          if old_export not in text:
              raise SystemExit("backup export anchor missing")
          text = text.replace(
              old_export,
              "{ settings: collectPortableBackupSettings() },",
              1,
          )

          old_import = '''      const settings = data.settings;
                if (!settings || typeof settings !== "object" || Array.isArray(settings))
                  throw new Error("settings missing");
                for (const [key, value] of Object.entries(settings)) {
                  if (key.startsWith("gys-") && typeof value === "string")
                    localStorage.setItem(key, value);
                }
          '''
          if old_import not in text:
              raise SystemExit("backup import anchor missing")
          text = text.replace(
              old_import,
              '''      const settings = data.settings;
                restorePortableBackupSettings(settings);
          ''',
              1,
          )

          old_copy = '''            Backup memuat preferensi, progres baca, bookmark, catatan, dan
                      indeks cache. Kata sandi tidak dikirim ke server.
          '''
          if old_copy not in text:
              raise SystemExit("backup copy anchor missing")
          text = text.replace(
              old_copy,
              '''            Backup memuat preferensi, progres baca, bookmark, dan catatan. Sesi
                      akun, data perangkat, serta cache tidak ikut disalin. Kata sandi tidak
                      dikirim ke server.
          ''',
              1,
          )
          path.write_text(text)
          PY
      - name: Format and verify focused changes
        run: |
          pnpm exec prettier --write apps/web/src/backup-settings.ts apps/web/src/backup-settings.test.ts apps/web/src/more.tsx
          pnpm --filter @gys/web exec vitest run src/backup-settings.test.ts src/asset-store.test.ts
          pnpm --filter @gys/web typecheck
      - name: Install Chromium
        run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Verify backup browser contract
        run: pnpm --filter @gys/web exec playwright test e2e/settings-data-integrity.spec.ts --project=chromium
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git rm .github/workflows/agent-backup-policy-fix.yml
          git add apps/web/src/backup-settings.ts apps/web/src/backup-settings.test.ts apps/web/src/more.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: enforce portable backup boundary"
          git push origin HEAD:audit/parity-ui-tts-20260911
