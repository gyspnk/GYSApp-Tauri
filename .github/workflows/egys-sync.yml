name: e-GYS contract sync

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check-egys-upstream.mjs --write
        env:
          EGYS_UPSTREAM_TOKEN: ${{ secrets.EGYS_UPSTREAM_TOKEN }}
      - name: Open update PR when the upstream contract moves
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update e-GYS upstream provenance"
          branch: automation/egys-upstream-sync
          delete-branch: true
          title: "chore: sync e-GYS upstream contract"
          body: "Updates the immutable e-GYS provenance lock. No upstream source code is copied."
          labels: dependencies,automated
