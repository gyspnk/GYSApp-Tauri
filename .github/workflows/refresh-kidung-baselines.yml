name: Refresh Kidung Baselines
# One-shot trigger after the workflow file is registered on this branch.

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - .github/workflows/refresh-kidung-baselines.yml

permissions:
  contents: write

concurrency:
  group: refresh-kidung-baselines
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Refresh only Kidung and reader Linux baselines
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts --config=playwright.ci.config.ts --grep='^(kidung|reader) ' --update-snapshots
      - name: Verify exact baseline scope
        shell: bash
        run: |
          mapfile -t changed < <(git diff --name-only -- 'apps/web/e2e/visual.spec.ts-snapshots/*.png' | sort)
          expected=(
            'apps/web/e2e/visual.spec.ts-snapshots/kidung-1440x900-linux.png'
            'apps/web/e2e/visual.spec.ts-snapshots/kidung-390x844-linux.png'
            'apps/web/e2e/visual.spec.ts-snapshots/kidung-768x1024-linux.png'
            'apps/web/e2e/visual.spec.ts-snapshots/reader-1440x900-linux.png'
            'apps/web/e2e/visual.spec.ts-snapshots/reader-390x844-linux.png'
            'apps/web/e2e/visual.spec.ts-snapshots/reader-768x1024-linux.png'
          )
          printf '%s\n' "${changed[@]}" > /tmp/changed.txt
          printf '%s\n' "${expected[@]}" | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/changed.txt
      - name: Commit refreshed baselines and self-remove helper
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/e2e/visual.spec.ts-snapshots/*.png
          git rm .github/workflows/refresh-kidung-baselines.yml
          git commit -m 'test: refresh Kidung visual baselines'
          git push origin HEAD:audit/parity-ui-tts-20260911
