name: Agent format calm reader

on:
  pull_request:
    paths:
      - ".github/workflows/agent-format-calm-reader.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write apps/web/e2e/reading-priority.spec.ts apps/web/src/calm-liturgical.css
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/reading-priority.spec.ts apps/web/src/calm-liturgical.css
          git diff --cached --check
          git commit -m "chore: format calm reader refinement"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
