name: Agent align current UX contracts

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-align-e2e.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Align tests to current direct-reader and guarded-reset contracts
        run: python3 scripts/agent-align-e2e-contracts.py
      - name: Format changed tests
        run: pnpm exec prettier --write apps/web/e2e/media-load.spec.ts apps/web/e2e/smoke.spec.ts
      - name: Verify static gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
      - name: Install Chromium
        run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Verify complete affected suites with one-page completion semantics
        run: pnpm --filter @gys/web exec playwright test e2e/media-load.spec.ts e2e/smoke.spec.ts --project=chromium --reporter=line
      - name: Commit verified contract alignment
        run: |
          git config user.name "gysapp-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/agent-align-e2e-contracts.py .github/workflows/agent-align-e2e.yml
          git add apps/web/e2e/media-load.spec.ts apps/web/e2e/smoke.spec.ts
          git commit -m "test: align suites with direct reader UX"
          git push origin HEAD:audit/parity-ui-tts-20260911
