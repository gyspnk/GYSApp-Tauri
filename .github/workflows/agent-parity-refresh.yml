name: Agent latest parity refresh

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-parity-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checkout immutable gyschordweb source
        run: |
          rm -rf .tmp-gyschordweb-latest
          git clone --filter=blob:none --no-checkout https://github.com/gyspnk/gyschordweb.git .tmp-gyschordweb-latest
          git -C .tmp-gyschordweb-latest checkout --detach 3039ae678c9e0e6ca439f4e1e0250759667dbcdf
          test "$(git -C .tmp-gyschordweb-latest rev-parse HEAD)" = "3039ae678c9e0e6ca439f4e1e0250759667dbcdf"
      - name: Regenerate immutable upstream data
        env:
          GYSCHORDWEB_SNAPSHOT: .tmp-gyschordweb-latest
          GYSCHORDWEB_COMMIT: 3039ae678c9e0e6ca439f4e1e0250759667dbcdf
        run: |
          pnpm generate:music-lock
          pnpm generate:chord-manifest
          pnpm generate:hymn-catalog
      - name: Update parity contracts to latest canonical source
        run: |
          python3 <<'PY'
          from pathlib import Path

          old = "a9bf3219105dca3dde1b286328f46a0eede3287e"
          new = "3039ae678c9e0e6ca439f4e1e0250759667dbcdf"

          for name in [
              "scripts/generate-music-lock.mjs",
              "scripts/generate-hymn-catalog.mjs",
              "scripts/verify-generated-provenance.mjs",
              "scripts/audit-chord-layout.mjs",
          ]:
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{name}: expected one source-commit contract, got {count}")
              path.write_text(text.replace(old, new, 1))

          verifier = Path("scripts/verify-generated-provenance.mjs")
          text = verifier.read_text()
          text = text.replace("lock.items.length !== 1221", "lock.items.length !== 1223", 1)
          text = text.replace("expected 1221 music entries", "expected 1223 music entries", 1)
          text = text.replace("chord.entries.length !== 153", "chord.entries.length !== 155", 1)
          marker = 'for (const requiredChord of [\n  "108_",'
          if marker not in text:
              raise SystemExit("required chord list marker missing")
          text = text.replace(
              marker,
              'for (const requiredChord of [\n  "106_",\n  "108_",',
              1,
          )
          marker = '  "322_",\n  "398_",'
          if marker not in text:
              raise SystemExit("required chord insertion marker missing")
          text = text.replace(marker, '  "322_",\n  "363_",\n  "398_",', 1)
          verifier.write_text(text)

          audit = Path("scripts/audit-chord-layout.mjs")
          text = audit.read_text()
          text = text.replace("lock.entries.length !== 153", "lock.entries.length !== 155", 1)
          text = text.replace("expected 153 chord entries", "expected 155 chord entries", 1)
          audit.write_text(text)

          matrix = Path("docs/discovery/feature-parity-matrix.md")
          text = matrix.read_text()
          addition = '''\n\n## September 12, 2026 canonical parity refresh\n\nRe-checked the immutable `gyspnk/gyschordweb` source at\n`3039ae678c9e0e6ca439f4e1e0250759667dbcdf`. Relative to the September 5\nlock, upstream adds two note-aligned chord assets: hymn 106\n(`Aku Murid Yesus`) and hymn 363 (`Berpegang Pada JanjiNya`). The generated\nmusic lock, chord manifest, offline runtime lock, hymn catalog, and strict chord\nposition audit are regenerated from that exact source commit. Canonical chord\nreferences are now 155. This refresh is only accepted when provenance, strict\ngeometry, unit, build, and bundle-budget verification all pass.\n'''
          if "## September 12, 2026 canonical parity refresh" not in text:
              matrix.write_text(text.rstrip() + addition)
          PY
      - name: Regenerate runtime manifests and strict chord audit
        run: |
          pnpm generate:offline-manifest
          node scripts/audit-chord-layout.mjs --source-root .tmp-gyschordweb-latest --strict
      - name: Format generated refresh
        run: |
          pnpm exec prettier --write \
            scripts/generate-music-lock.mjs \
            scripts/generate-hymn-catalog.mjs \
            scripts/verify-generated-provenance.mjs \
            scripts/audit-chord-layout.mjs \
            packages/contracts/generated/upstream-music-lock.json \
            packages/contracts/generated/chord-manifest.json \
            packages/contracts/generated/hymn-catalog.json \
            apps/bff/src/chord-manifest.ts \
            apps/web/public/offline/music-lock.json \
            apps/web/public/offline/hymn-catalog.json \
            apps/web/public/offline/pack-manifest.json \
            apps/web/public/offline/asset-manifest.json \
            apps/web/public/offline/bible/manifest.json \
            docs/discovery/chord-position-audit.json \
            docs/discovery/feature-parity-matrix.md
      - name: Verify latest parity and application gates
        run: |
          pnpm verify:generated
          node scripts/audit-chord-layout.mjs --source-root .tmp-gyschordweb-latest --strict --check
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:bundle
      - name: Commit verified parity refresh
        run: |
          git config user.name "gysapp-agent"
          git config user.email "actions@users.noreply.github.com"
          rm -rf .tmp-gyschordweb-latest
          git rm .github/workflows/agent-parity-refresh.yml
          git add \
            scripts/generate-music-lock.mjs \
            scripts/generate-hymn-catalog.mjs \
            scripts/verify-generated-provenance.mjs \
            scripts/audit-chord-layout.mjs \
            packages/contracts/generated/upstream-music-lock.json \
            packages/contracts/generated/chord-manifest.json \
            packages/contracts/generated/hymn-catalog.json \
            apps/bff/src/chord-manifest.ts \
            apps/web/public/offline/music-lock.json \
            apps/web/public/offline/hymn-catalog.json \
            apps/web/public/offline/pack-manifest.json \
            apps/web/public/offline/asset-manifest.json \
            apps/web/public/offline/bible/manifest.json \
            docs/discovery/chord-position-audit.json \
            docs/discovery/feature-parity-matrix.md
          git commit -m "chore: sync latest gyschordweb chord provenance"
          git push origin HEAD:audit/parity-ui-tts-20260911
