name: Release cadence

# The rule is one APK build every 25 rounds, and rounds used to be counted by
# hand, so a long stretch could pass the due turn without a release appearing.
# Rounds end in commits, so the count since the last release tag is the witness:
# when it reaches the interval this job dispatches the release itself.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: release-cadence
  cancel-in-progress: false

jobs:
  due:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether a release is due
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A release already queued or running would duplicate the tag.
          active=$(gh run list --workflow android-release.yml --limit 20 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$active" != "0" ]; then
            echo "release already $active active; waiting" >> "$GITHUB_STEP_SUMMARY"
            echo "due=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Exit 0 means release now, 2 means waiting; anything else is a real
          # failure and must stay red instead of silently skipping releases.
          status=0
          message=$(node scripts/release-due.mjs) || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
            echo "release-due exited $status" >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          if [ "${message#due:}" != "$message" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Dispatch the release
        if: steps.decide.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          turn=$(node scripts/release-due.mjs --turn | tail -n 1)
          if [ -z "$turn" ]; then
            echo "no turn to dispatch; the cadence file is incomplete" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "dispatching android-release.yml for turn $turn" | tee -a "$GITHUB_STEP_SUMMARY"
          gh workflow run android-release.yml --ref main -f "turn=$turn"
