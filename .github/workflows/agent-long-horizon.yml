name: Agent TTS verification

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911

permissions:
  contents: write

jobs:
  tts:
    if: "${{ !contains(github.event.head_commit.message, '[agent-generated]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri Linux system dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev

      - name: Apply verified native wiring and strict type fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          lib = Path('apps/native/src-tauri/src/lib.rs')
          text = lib.read_text()
          anchor = 'tauri::Builder::default()\n'
          plugin = '        .plugin(tauri_plugin_websocket::init())\n'
          if plugin not in text:
              text = text.replace(anchor, anchor + plugin, 1)
          lib.write_text(text)

          capability = Path('apps/native/src-tauri/capabilities/default.json')
          data = json.loads(capability.read_text())
          permissions = data['permissions']
          if 'websocket:default' not in permissions:
              insert_at = permissions.index('shell:default') + 1
              permissions.insert(insert_at, 'websocket:default')
          capability.write_text(json.dumps(data, indent=2) + '\n')

          direct = Path('apps/web/src/edge-direct.ts')
          source = direct.read_text()
          source = source.replace(
              'const headerLength = (bytes[0] << 8) | bytes[1];',
              'const headerLength = ((bytes[0] ?? 0) << 8) | (bytes[1] ?? 0);',
          )
          source = source.replace(
              'const blob = new Blob(chunks, { type: "audio/mpeg" });',
              'const blob = new Blob(\n        chunks.map((chunk) => chunk.slice().buffer as ArrayBuffer),\n        { type: "audio/mpeg" },\n      );',
          )
          direct.write_text(source)
          PY

      - name: Resolve lockfiles
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace dependencies
        run: |
          pnpm --filter @gys/contracts build
          pnpm --filter @gys/domain build

      - name: Focused TTS tests
        run: pnpm --filter @gys/web exec vitest run --config vitest.config.ts src/edge-direct.test.ts src/edge-speech.test.ts

      - name: Web typecheck
        run: pnpm --filter @gys/web typecheck

      - name: Native check
        run: cargo check --manifest-path apps/native/src-tauri/Cargo.toml

      - name: Format and reverify
        run: |
          pnpm exec prettier --write apps/web/src/edge-direct.ts apps/web/src/edge-direct.test.ts apps/web/src/edge-speech.ts apps/web/package.json apps/native/src-tauri/capabilities/default.json
          cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
          pnpm --filter @gys/web exec vitest run --config vitest.config.ts src/edge-direct.test.ts src/edge-speech.test.ts
          pnpm --filter @gys/web typecheck
          cargo check --manifest-path apps/native/src-tauri/Cargo.toml

      - name: Commit verified TTS dependency wiring
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/src/edge-direct.ts apps/web/src/edge-direct.test.ts apps/web/src/edge-speech.ts apps/native/src-tauri/Cargo.toml apps/native/src-tauri/src/lib.rs apps/native/src-tauri/capabilities/default.json pnpm-lock.yaml apps/native/src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "feat(tts): enable keyless Edge speech in native app [agent-generated]"
            git push origin HEAD:audit/parity-ui-tts-20260911
          fi
