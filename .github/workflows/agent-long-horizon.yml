name: Agent UX refinement

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911

permissions:
  contents: write

jobs:
  ux:
    if: "${{ !contains(github.event.head_commit.message, '[agent-generated]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: |
          pnpm --filter @gys/contracts build
          pnpm --filter @gys/domain build

      - name: Remove blanket interaction animation and refine shell surfaces
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/web/src/App.tsx')
          source = app.read_text()
          start_marker = '  useEffect(() => {\n    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");\n    const animateControl = (target: EventTarget | null) => {\n'
          end_marker = '  useEffect(() => {\n    const onShortcut = (event: KeyboardEvent) => {\n'
          start = source.find(start_marker)
          end = source.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('global control animation block not found')
          source = source[:start] + source[end:]
          app.write_text(source)

          css = Path('apps/web/src/styles.css')
          style = css.read_text()
          marker = '/* Long-horizon UX refinement: quiet, state-led interaction */'
          block = r'''

          /* Long-horizon UX refinement: quiet, state-led interaction */
          .search-trigger,
          .account-button,
          .sidebar-collapse-toggle,
          .media-minimize,
          .media-close-button {
            min-width: 44px;
            min-height: 44px;
          }

          .search-trigger:hover,
          .account-button:hover,
          .global-search-result:hover,
          .primary-button:hover,
          .quiet-button:hover,
          .text-button:hover {
            transform: none;
          }

          .search-trigger:hover,
          .account-button:hover,
          .sidebar-collapse-toggle:hover {
            box-shadow: none;
          }

          .topbar,
          .navigation-shell {
            box-shadow: none;
          }

          .media-surface {
            box-shadow: 0 8px 24px color-mix(in srgb, var(--text) 13%, transparent);
          }

          .nav-item,
          .search-trigger,
          .account-button,
          .sidebar-collapse-toggle,
          .media-control,
          .media-minimize,
          .media-close-button {
            transition-timing-function: var(--ease-out, cubic-bezier(.2,.8,.2,1));
          }

          @media (prefers-reduced-motion: reduce) {
            html {
              scroll-behavior: auto !important;
            }
            .route-view,
            .workspace,
            .navigation-shell,
            .nav-item,
            .nav-active-indicator,
            .nav-copy,
            .sidebar-foot,
            .sidebar-collapse-toggle,
            .media-surface,
            .media-control,
            .media-minimize,
            .media-close-button,
            .search-trigger,
            .account-button,
            .global-search-result,
            .reader-context-button,
            .control-select-trigger,
            .popover,
            .menu-popover {
              animation: none !important;
              transition: none !important;
              scroll-behavior: auto !important;
            }
          }
          '''
          if marker not in style:
              css.write_text(style.rstrip() + block + '\n')
          PY

      - name: Add responsive theme and reduced-motion UX verification
        shell: bash
        run: |
          cat > apps/web/e2e/ux-refinement.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";

          async function setTheme(page: Page, theme: "light" | "dark") {
            await page.addInitScript((selected) => {
              localStorage.setItem(
                "gys-shell-settings-v1",
                JSON.stringify({ version: 1, locale: "id", theme: selected }),
              );
              localStorage.setItem("gys-theme", selected);
            }, theme);
          }

          async function expectNoHorizontalOverflow(page: Page) {
            await expect.poll(() => page.evaluate(() => document.documentElement.scrollWidth <= document.documentElement.clientWidth + 1)).toBe(true);
          }

          test("desktop light shell is compact, stable, and uses reachable controls", async ({ page }) => {
            await setTheme(page, "light");
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto("/GYSApp-Tauri/");
            await expect(page.locator("html")).toHaveAttribute("data-theme", "light");
            await expectNoHorizontalOverflow(page);
            const collapse = page.getByRole("button", { name: "Ciutkan navigasi" });
            const box = await collapse.boundingBox();
            expect(box).not.toBeNull();
            expect(box!.width).toBeGreaterThanOrEqual(44);
            expect(box!.height).toBeGreaterThanOrEqual(44);
            await expect(page.locator(".topbar")).toHaveCSS("box-shadow", "none");
            await page.screenshot({ path: "test-results/ux-light-desktop.png", fullPage: true });
          });

          test("dark tablet shell preserves density and viewport containment", async ({ page }) => {
            await setTheme(page, "dark");
            await page.setViewportSize({ width: 768, height: 1024 });
            await page.goto("/GYSApp-Tauri/");
            await expect(page.locator("html")).toHaveAttribute("data-theme", "dark");
            await expectNoHorizontalOverflow(page);
            const nav = await page.locator(".navigation-shell").boundingBox();
            expect(nav).not.toBeNull();
            expect(nav!.x).toBeGreaterThanOrEqual(0);
            expect(nav!.x + nav!.width).toBeLessThanOrEqual(768);
            await page.screenshot({ path: "test-results/ux-dark-tablet.png", fullPage: true });
          });

          test("phone composition remains contained above bottom navigation", async ({ page }) => {
            await setTheme(page, "light");
            await page.setViewportSize({ width: 390, height: 844 });
            await page.goto("/GYSApp-Tauri/");
            await expectNoHorizontalOverflow(page);
            const nav = await page.locator(".navigation-shell").boundingBox();
            expect(nav).not.toBeNull();
            expect(nav!.x).toBeGreaterThanOrEqual(0);
            expect(nav!.x + nav!.width).toBeLessThanOrEqual(390);
            expect(nav!.y + nav!.height).toBeLessThanOrEqual(844);
            await page.screenshot({ path: "test-results/ux-light-phone.png", fullPage: true });
          });

          test("reduced motion removes shell and dock transitions", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.setViewportSize({ width: 1440, height: 900 });
            await page.goto("/GYSApp-Tauri/");
            await expect(page.locator(".workspace")).toHaveCSS("transition-duration", "0s");
            await expect(page.locator(".sidebar-collapse-toggle")).toHaveCSS("transition-duration", "0s");
            expect(await page.evaluate(() => getComputedStyle(document.documentElement).scrollBehavior)).toBe("auto");
          });
          EOF

      - name: Format, typecheck, and build
        run: |
          pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/styles.css apps/web/e2e/ux-refinement.spec.ts
          pnpm --filter @gys/web typecheck
          pnpm --filter @gys/web build

      - name: Install Chromium
        run: pnpm --filter @gys/web exec playwright install --with-deps chromium

      - name: Run UX and shell regression verification
        run: |
          mkdir -p apps/web/test-results
          pnpm --filter @gys/web exec playwright test e2e/ux-refinement.spec.ts e2e/sidebar-collapse.spec.ts e2e/media-dock.spec.ts e2e/navigation-layout.spec.ts

      - name: Upload UX evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ux-evidence-${{ github.run_id }}
          path: apps/web/test-results/ux-*.png
          if-no-files-found: ignore

      - name: Commit verified UX refinement
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/styles.css apps/web/e2e/ux-refinement.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "refactor(ux): use restrained state-led motion and shell surfaces [agent-generated]"
            git push origin HEAD:audit/parity-ui-tts-20260911
          fi
