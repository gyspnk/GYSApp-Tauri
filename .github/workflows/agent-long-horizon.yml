name: Agent media dock verification

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911

permissions:
  contents: write

jobs:
  media:
    if: "${{ !contains(github.event.head_commit.message, '[agent-generated]') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace dependencies
        run: |
          pnpm --filter @gys/contracts build
          pnpm --filter @gys/domain build

      - name: RED - define dock behavior before implementation
        shell: bash
        run: |
          cat > apps/web/e2e/media-dock.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";

          async function openSpeechPlayer(page: Page) {
            await page.goto("/GYSApp-Tauri/bible");
            await expect(page.getByRole("heading", { name: "Alkitab", exact: true })).toBeVisible();
            const read = page.getByRole("button", { name: "Bacakan" });
            await expect(read).toBeEnabled({ timeout: 15_000 });
            await read.click();
            await expect(page.locator(".media-surface")).toBeVisible({ timeout: 15_000 });
          }

          test("persistent media defaults to one centered semantic dock", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await openSpeechPlayer(page);
            const surface = page.locator(".media-surface");
            const box = await surface.boundingBox();
            expect(box).not.toBeNull();
            expect(Math.abs(box!.x + box!.width / 2 - 720)).toBeLessThanOrEqual(3);
            await expect(page.getByRole("button", { name: "Ciutkan panel" })).toHaveCount(0);
            const minimize = page.getByRole("button", { name: "Minimalkan pemutar" });
            await expect(minimize).toHaveCount(1);
            await expect(minimize.locator("svg")).toHaveCount(1);
          });
          EOF
          pnpm --filter @gys/web exec playwright install --with-deps chromium >/dev/null
          set +e
          pnpm --filter @gys/web exec playwright test e2e/media-dock.spec.ts > /tmp/media-red.log 2>&1
          code=$?
          set -e
          cat /tmp/media-red.log
          test "$code" -ne 0
          grep -E "persistent media defaults|failed" /tmp/media-red.log

      - name: GREEN - unify media placement and minimize controls
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('apps/web/src/App.tsx')
          source = app.read_text()

          old_class = 'className={`media-surface${minimized ? " is-minimized" : ""}${isKidungMedia ? " is-kidung-media" : ""}${speechActive ? " is-speech-media" : ""}${dragging ? " is-dragging" : ""}`}'
          new_class = 'className={`media-surface${minimized ? " is-minimized" : ""}${isKidungMedia ? " is-kidung-media" : ""}${speechActive ? " is-speech-media" : ""}${position ? " has-custom-position" : ""}${dragging ? " is-dragging" : ""}`}'
          if old_class not in source:
              raise SystemExit('media surface class anchor not found')
          source = source.replace(old_class, new_class, 1)

          collapse = '''      {(isKidungMedia || speechActive) && !minimized && (\n        <button\n          className="media-collapse-toggle"\n          type="button"\n          onClick={() => setMinimized(true)}\n          aria-expanded="true"\n          aria-label="Ciutkan panel"\n        >\n          <span className="media-collapse-grip" aria-hidden="true" />\n          <Icon name="chevronDown" size={15} />\n        </button>\n      )}\n'''
          if collapse not in source:
              raise SystemExit('duplicate collapse control anchor not found')
          source = source.replace(collapse, '', 1)

          begin_anchor = '  const beginDrag = (event: ReactPointerEvent<HTMLDivElement>) => {\n'
          if begin_anchor not in source:
              raise SystemExit('beginDrag anchor not found')
          source = source.replace(
              begin_anchor,
              begin_anchor + '    if (window.matchMedia("(max-width: 959px)").matches) return;\n',
              1,
          )
          keyboard_anchor = '  const moveByKeyboard = (event: ReactKeyboardEvent<HTMLDivElement>) => {\n'
          if keyboard_anchor not in source:
              raise SystemExit('keyboard drag anchor not found')
          source = source.replace(
              keyboard_anchor,
              keyboard_anchor + '    if (window.matchMedia("(max-width: 959px)").matches) return;\n',
              1,
          )

          close_old = '''        >\n          ✕\n        </button>\n      )}\n      <button\n        className="media-minimize"'''
          close_new = '''        >\n          <Icon name="cross" size={16} />\n        </button>\n      )}\n      <button\n        className="media-minimize"'''
          if close_old not in source:
              raise SystemExit('media close glyph anchor not found')
          source = source.replace(close_old, close_new, 1)

          glyph_old = '''      >\n        {minimized ? "↗" : "−"}\n      </button>\n    </aside>'''
          glyph_new = '''      >\n        <Icon name={minimized ? "chevronUp" : "chevronDown"} size={16} />\n      </button>\n    </aside>'''
          if glyph_old not in source:
              raise SystemExit('media minimize glyph anchor not found')
          source = source.replace(glyph_old, glyph_new, 1)
          app.write_text(source)

          css = Path('apps/web/src/styles.css')
          style = css.read_text()
          marker = '/* Long-horizon media refinement: centered persistent dock */'
          block = r'''

          /* Long-horizon media refinement: centered persistent dock */
          .media-surface {
            max-width: min(720px, calc(100vw - 32px));
            transition:
              width var(--motion-normal) var(--ease-out),
              max-width var(--motion-normal) var(--ease-out),
              transform var(--motion-normal) var(--ease-out),
              bottom var(--motion-normal) var(--ease-out),
              box-shadow var(--motion-fast) var(--ease-out);
          }
          .media-surface:not(.has-custom-position) {
            left: 50%;
            right: auto;
            bottom: 18px;
            transform: translateX(-50%);
          }
          .media-surface.has-custom-position {
            transform: none;
          }
          .media-surface.is-minimized {
            width: min(360px, calc(100vw - 32px));
            max-width: min(360px, calc(100vw - 32px));
          }
          .media-minimize,
          .media-close-button {
            width: 44px;
            height: 44px;
            min-width: 44px;
            min-height: 44px;
            border-radius: 9px;
          }
          .media-surface.is-minimized .media-mini-context {
            min-width: 0;
          }
          @media (max-width: 959px) {
            .media-surface,
            .media-surface.has-custom-position {
              left: 50% !important;
              right: auto !important;
              top: auto !important;
              bottom: 18px !important;
              transform: translateX(-50%) !important;
              width: min(560px, calc(100vw - 24px));
              max-width: min(560px, calc(100vw - 24px));
            }
            .media-surface.is-minimized {
              width: min(360px, calc(100vw - 24px));
              max-width: min(360px, calc(100vw - 24px));
            }
            .media-drag-handle {
              cursor: default;
            }
          }
          @media (max-width: 599px) {
            .media-surface,
            .media-surface.has-custom-position {
              bottom: calc(78px + env(safe-area-inset-bottom)) !important;
              width: calc(100vw - 24px);
              max-width: calc(100vw - 24px);
            }
            .media-surface.is-minimized {
              width: min(360px, calc(100vw - 24px));
              max-width: min(360px, calc(100vw - 24px));
            }
          }
          @media (prefers-reduced-motion: reduce) {
            .media-surface,
            .media-minimize,
            .media-close-button {
              transition: none !important;
              animation: none !important;
            }
          }
          '''
          if marker not in style:
              css.write_text(style.rstrip() + block + '\n')
          PY

      - name: Expand media regression coverage
        shell: bash
        run: |
          cat > apps/web/e2e/media-dock.spec.ts <<'EOF'
          import { expect, test, type Page } from "@playwright/test";

          async function openSpeechPlayer(page: Page) {
            await page.goto("/GYSApp-Tauri/bible");
            await expect(page.getByRole("heading", { name: "Alkitab", exact: true })).toBeVisible();
            const read = page.getByRole("button", { name: "Bacakan" });
            await expect(read).toBeEnabled({ timeout: 15_000 });
            await read.click();
            await expect(page.locator(".media-surface")).toBeVisible({ timeout: 15_000 });
          }

          async function expectCentered(page: Page, width: number) {
            const box = await page.locator(".media-surface").boundingBox();
            expect(box).not.toBeNull();
            expect(Math.abs(box!.x + box!.width / 2 - width / 2)).toBeLessThanOrEqual(3);
            return box!;
          }

          test("persistent media defaults to one centered semantic dock", async ({ page }) => {
            await page.setViewportSize({ width: 1440, height: 900 });
            await openSpeechPlayer(page);
            await expectCentered(page, 1440);
            await expect(page.getByRole("button", { name: "Ciutkan panel" })).toHaveCount(0);

            const minimize = page.getByRole("button", { name: "Minimalkan pemutar" });
            await expect(minimize).toHaveCount(1);
            await expect(minimize.locator("svg")).toHaveCount(1);
            const controlBox = await minimize.boundingBox();
            expect(controlBox).not.toBeNull();
            expect(controlBox!.width).toBeGreaterThanOrEqual(44);
            expect(controlBox!.height).toBeGreaterThanOrEqual(44);

            await minimize.click();
            await expect(page.locator(".media-surface.is-minimized")).toBeVisible();
            await expect.poll(() => page.evaluate(() => localStorage.getItem("gys-media-minimized"))).toBe("1");
            const restore = page.getByRole("button", { name: "Perbesar pemutar" });
            await expect(restore.locator("svg")).toHaveCount(1);
            await restore.click();
            await expect(page.locator(".media-surface")).not.toHaveClass(/is-minimized/);
            await expect.poll(() => page.evaluate(() => localStorage.getItem("gys-media-minimized"))).toBe("0");
          });

          test("phone ignores stale dragged position and keeps the dock above bottom navigation", async ({ page }) => {
            await page.setViewportSize({ width: 390, height: 844 });
            await page.addInitScript(() => {
              localStorage.setItem("gys-media-position-v1", JSON.stringify({ left: 8, top: 8 }));
              localStorage.setItem("gys-media-minimized", "0");
            });
            await openSpeechPlayer(page);
            const media = await expectCentered(page, 390);
            const nav = await page.locator(".navigation-shell").boundingBox();
            expect(nav).not.toBeNull();
            expect(media.y + media.height).toBeLessThanOrEqual(nav!.y);
          });

          test("tablet uses stable centered dock geometry", async ({ page }) => {
            await page.setViewportSize({ width: 768, height: 1024 });
            await page.addInitScript(() => localStorage.removeItem("gys-media-position-v1"));
            await openSpeechPlayer(page);
            const media = await expectCentered(page, 768);
            expect(media.x).toBeGreaterThanOrEqual(12);
            expect(media.x + media.width).toBeLessThanOrEqual(756);
          });
          EOF

      - name: Format typecheck and build
        run: |
          pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/styles.css apps/web/e2e/media-dock.spec.ts
          pnpm --filter @gys/web typecheck
          pnpm --filter @gys/web build

      - name: Verify media dock and existing regression suite
        run: |
          pnpm --filter @gys/web exec playwright test e2e/media-dock.spec.ts e2e/smoke.spec.ts e2e/navigation-layout.spec.ts

      - name: Commit verified media dock
        shell: bash
        run: |
          git config user.name "OpenAI Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/styles.css apps/web/e2e/media-dock.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "feat(media): unify responsive persistent dock [agent-generated]"
            git push origin HEAD:audit/parity-ui-tts-20260911
          fi
