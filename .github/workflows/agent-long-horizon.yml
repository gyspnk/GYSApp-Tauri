name: Agent TTS verification

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911

jobs:
  tts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused TTS tests
        run: pnpm --filter @gys/web test -- edge-direct.test.ts edge-speech.test.ts
      - name: Web typecheck
        if: ${{ success() }}
        run: pnpm --filter @gys/web typecheck
