name: Agent asset anchor stability

on:
  pull_request:
    paths:
      - "apps/web/src/route-section-deeplink.ts"
      - "apps/web/e2e/visual.spec.ts"
      - ".github/workflows/agent-asset-anchor-stability.yml"

permissions:
  contents: read

jobs:
  asset-anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Repeat tablet asset anchor visual contract
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts -g "assets 768x1024 visual baseline" --workers=1 --repeat-each=4
