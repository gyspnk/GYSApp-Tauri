name: Agent More menu RED

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-more-red.yml"

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Expected RED regression
        run: pnpm --filter @gys/web exec playwright test e2e/more-device-data.spec.ts --project=chromium
