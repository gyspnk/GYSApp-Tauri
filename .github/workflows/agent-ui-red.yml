name: Agent UI inline-hit-area verifier

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-ui-red.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary verifier; removed before the final exact-SHA CI gate.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Inline-safe touch target contract
        run: pnpm --filter @gys/web exec playwright test e2e/responsive-touch-targets.spec.ts --project=chromium
      - name: Existing Bible reader containment contract
        run: pnpm --filter @gys/web exec playwright test e2e/navigation-layout.spec.ts --project=chromium
