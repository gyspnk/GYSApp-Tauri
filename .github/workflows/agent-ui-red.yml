name: Agent compact Kidung verifier

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-ui-red.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary focused verifier; removed before the final exact-SHA CI gate.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Diagnose first compact Kidung row
        run: |
          cat > apps/web/e2e/.agent-kidung-diagnostic.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";
          test.use({ serviceWorkers: "block" });
          test("diagnose first Kidung row at 320px", async ({ page }) => {
            await page.setViewportSize({ width: 320, height: 720 });
            await page.goto("/GYSApp-Tauri/kidung");
            await expect(page.getByRole("heading", { name: "Kidung", exact: true })).toBeVisible();
            const data = await page.locator(".pujian-item").first().evaluate((item) => {
              const read = (el: Element | null) => {
                if (!el) return null;
                const rect = el.getBoundingClientRect();
                const style = getComputedStyle(el);
                return {
                  className: (el as HTMLElement).className,
                  x: rect.x,
                  width: rect.width,
                  right: rect.right,
                  display: style.display,
                  minWidth: style.minWidth,
                  widthCss: style.width,
                  flex: style.flex,
                  flexBasis: style.flexBasis,
                  flexGrow: style.flexGrow,
                  flexShrink: style.flexShrink,
                  gap: style.gap,
                  paddingInline: `${style.paddingInlineStart}/${style.paddingInlineEnd}`,
                  whiteSpace: style.whiteSpace,
                  overflow: style.overflow,
                };
              };
              return {
                viewport: innerWidth,
                documentWidth: document.documentElement.scrollWidth,
                page: read(item.closest(".hymn-page")),
                list: read(item.closest(".pujian-list")),
                item: read(item),
                number: read(item.querySelector(".pujian-nomor")),
                title: read(item.querySelector(".pujian-title")),
                chord: read(item.querySelector(".chord-indicator")),
                add: read(item.querySelector(".add-to-playlist-btn")),
              };
            });
            console.log("KIDUNG_DIAGNOSTIC", JSON.stringify(data));
          });
          EOF
          pnpm --filter @gys/web exec playwright test e2e/.agent-kidung-diagnostic.spec.ts --project=chromium
          rm apps/web/e2e/.agent-kidung-diagnostic.spec.ts
      - name: Compact Kidung contract
        run: pnpm --filter @gys/web exec playwright test e2e/responsive-touch-targets.spec.ts --project=chromium
