name: Agent runtime 404 diagnostic

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-ui-red.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary diagnostic; removed before the final exact-SHA CI gate.
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - run: pnpm build
      - name: Start preview
        run: |
          pnpm --filter @gys/web exec vite preview --host 127.0.0.1 --port 4173 > /tmp/gys-preview.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/GYSApp-Tauri/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/gys-preview.log
          exit 1
      - name: Trace 404 responses
        run: |
          cat > apps/web/e2e/.agent-runtime-404.spec.ts <<'EOF'
          import { test } from "@playwright/test";
          test.use({ serviceWorkers: "block" });
          for (const route of ["/", "/assets"]) {
            test(`trace 404s ${route}`, async ({ page }) => {
              const failures: string[] = [];
              page.on("response", (response) => {
                if (response.status() === 404) failures.push(`${response.request().method()} ${response.url()}`);
              });
              await page.goto(`/GYSApp-Tauri${route}`, { waitUntil: "domcontentloaded" });
              await page.waitForTimeout(1400);
              console.log(`TRACE404 route=${route} count=${failures.length}`);
              for (const failure of failures) console.log(`TRACE404 ${failure}`);
            });
          }
          EOF
          pnpm --filter @gys/web exec playwright test e2e/.agent-runtime-404.spec.ts --project=chromium
          rm apps/web/e2e/.agent-runtime-404.spec.ts
