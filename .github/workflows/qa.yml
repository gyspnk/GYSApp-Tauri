name: QA artifacts

# The device that writes code no longer carries browser, audit or visual
# workload (owner decision, 2 Nov). This workflow builds the app once, then
# runs the parts that need a real browser on hosted runners and publishes the
# results as artifacts the author can download and review:
#
#   * ui-screenshots-<run>: deterministic route screenshots per theme/width
#   * ui-audit-<run>: overflow, card-in-card and alignment audit reports
#
# It is intentionally manual: the CI workflow already runs the functional
# suites on every push, and screenshots are pulled when a visual review is
# actually needed instead of burning minutes on every commit.

on:
  workflow_dispatch:
    inputs:
      themes:
        description: "Comma-separated themes to capture"
        required: false
        default: "light,dark,sepia,amoled"
      widths:
        description: "Comma-separated viewport widths"
        required: false
        default: "390,768,1440"

permissions:
  contents: read

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the workspace
        run: pnpm build
      - run: pnpm verify:bundle
      - name: Upload the built app
        uses: actions/upload-artifact@v4
        with:
          name: qa-build-${{ github.run_id }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 1

  screens:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the built app
        uses: actions/download-artifact@v4
        with:
          name: qa-build-${{ github.run_id }}
          path: apps/web/dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Serve the built app
        run: |
          set -eu
          pnpm --filter @gys/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/GYSApp-Tauri/; then
              echo "preview ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Capture route screenshots
        env:
          SHOT_WIDTHS: ${{ inputs.widths }}
          SHOT_THEMES: ${{ inputs.themes }}
          SHOT_DIR: ui-screenshots
        run: pnpm --filter @gys/web exec node scripts/ui-screenshots.mjs
      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-${{ github.run_id }}
          path: apps/web/ui-screenshots
          if-no-files-found: warn
          retention-days: 7

  audits:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the built app
        uses: actions/download-artifact@v4
        with:
          name: qa-build-${{ github.run_id }}
          path: apps/web/dist
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Serve the built app
        run: |
          set -eu
          pnpm --filter @gys/web exec vite preview --host 127.0.0.1 --port 4173 --strictPort >/tmp/preview.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/GYSApp-Tauri/; then
              echo "preview ready after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/preview.log
          exit 1
      - name: Overflow and clipping audit (four themes)
        env:
          UI_AUDIT_THEMES: light,dark,sepia,amoled
          UI_AUDIT_VIEWPORTS: 320x720,390x844,768x1024,1440x900
        run: |
          set -o pipefail
          pnpm ui:audit | tee ui-overflow-audit.json
          jq -e '.problems | length == 0' ui-overflow-audit.json
      - name: Card-in-card audit (four themes)
        env:
          UI_AUDIT_THEMES: light,dark,sepia,amoled
        run: |
          set -o pipefail
          pnpm ui:boxes | tee ui-box-audit.json
          jq -e '.findings | length == 0' ui-box-audit.json
      - name: Alignment audit (four themes)
        env:
          UI_AUDIT_THEMES: light,dark,sepia,amoled
        run: |
          set -o pipefail
          pnpm ui:consistency | tee ui-consistency-audit.json
          jq -e '.findings | length == 0' ui-consistency-audit.json
      - name: Upload audit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-audit-${{ github.run_id }}
          path: |
            ui-overflow-audit.json
            ui-box-audit.json
            ui-consistency-audit.json
          if-no-files-found: warn
          retention-days: 7
