name: GitHub Pages

on:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set this repository variable to the deployed Worker origin. Keeping it
      # optional preserves a fully usable static/offline Pages preview.
      VITE_BFF_BASE_URL: ${{ vars.VITE_BFF_BASE_URL }}
      # Optional direct gateway override for Edge-compatible speech. When it
      # is empty, the web adapter derives /api/v1/tts/edge from the BFF base.
      VITE_EDGE_TTS_URL: ${{ vars.VITE_EDGE_TTS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/configure-pages@v5
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:generated
      - run: pnpm verify:docs
      - run: pnpm build
      - run: pnpm verify:bundle
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
