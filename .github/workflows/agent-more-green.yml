name: More menu verification
on:
  push:
    branches: [audit/parity-ui-tts-20260911]
    paths: [.github/workflows/agent-more-green.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python3 scripts/agent-more-patch.py
      - run: pnpm exec prettier --write apps/web/src/more.tsx apps/web/src/styles.css apps/web/e2e/more-device-data.spec.ts
      - run: pnpm format:check && pnpm lint && pnpm typecheck && pnpm test && pnpm build && pnpm verify:bundle
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - run: pnpm --filter @gys/web exec playwright test e2e/more-device-data.spec.ts --project=chromium
      - name: Commit verified hierarchy
        run: |
          git config user.name "gysapp-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/agent-more-red.yml .github/workflows/agent-more-green.yml scripts/agent-more-patch.py
          git add apps/web/src/more.tsx apps/web/src/styles.css apps/web/e2e/more-device-data.spec.ts
          git commit -m "refactor: make device reset safer and secondary"
          git push origin HEAD:audit/parity-ui-tts-20260911
