name: Agent full parity and visual QA

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-full-qa.yml"

permissions:
  contents: read

jobs:
  web-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Web code gates
        run: |
          pnpm verify:generated
          pnpm verify:docs
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
          pnpm verify:native-assets
          pnpm verify:bundle
          pnpm audit --prod
      - name: Install Chromium
        run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Run complete browser suite
        id: browser
        shell: bash
        run: |
          set +e
          pnpm --filter @gys/web exec playwright test --project=chromium --reporter=line
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-qa-playwright
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 3
      - name: Enforce browser result
        if: steps.browser.outputs.exit_code != '0'
        run: exit 1

  native-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo check --manifest-path apps/native/src-tauri/Cargo.toml
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets -- -D warnings
