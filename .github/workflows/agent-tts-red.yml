name: Agent TTS green verifier

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - '.github/workflows/agent-tts-red.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Multilingual TTS regression suite
        run: pnpm --filter @gys/web exec vitest run src/speech-language.test.ts src/edge-direct.test.ts
      - name: Web typecheck
        run: pnpm --filter @gys/web typecheck
      - name: Workspace build
        run: pnpm build
      - name: Live keyless Edge-compatible smoke
        shell: bash
        run: |
          python -m pip install --quiet edge-tts==7.2.8
          edge-tts --voice id-ID-GadisNeural --text 'Tuhan adalah gembalaku.' --write-media /tmp/edge-id.mp3
          edge-tts --voice en-US-JennyNeural --text 'The Lord is my shepherd.' --write-media /tmp/edge-en.mp3
          edge-tts --voice zh-CN-XiaoxiaoNeural --text '神是我的牧者。' --write-media /tmp/edge-zh.mp3
          for audio in /tmp/edge-id.mp3 /tmp/edge-en.mp3 /tmp/edge-zh.mp3; do
            bytes=$(wc -c < "$audio")
            echo "$audio bytes=$bytes"
            test "$bytes" -gt 1000
          done
