name: Agent TTS live verifier

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-tts-red.yml"
  workflow_dispatch:

permissions:
  contents: read

# Temporary long-horizon verifier; removed before the final CI gate.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Multilingual TTS regression suite
        run: pnpm --filter @gys/web exec vitest run src/speech-language.test.ts src/edge-direct.test.ts
      - name: Web typecheck
        run: pnpm --filter @gys/web typecheck
      - name: Workspace build
        run: pnpm build
      - name: Live keyless Edge-compatible smoke
        shell: bash
        run: |
          python -m pip install --quiet edge-tts==7.2.8
          synthesize() {
            local voice="$1"
            local text="$2"
            local output="$3"
            for attempt in 1 2 3; do
              rm -f "$output"
              if edge-tts --voice "$voice" --text "$text" --write-media "$output"; then
                bytes=$(wc -c < "$output")
                echo "$voice attempt=$attempt bytes=$bytes"
                if [ "$bytes" -gt 1000 ]; then
                  return 0
                fi
              fi
              sleep $((attempt * 2))
            done
            echo "No usable audio returned for $voice after 3 attempts" >&2
            return 1
          }
          synthesize id-ID-GadisNeural "Tuhan adalah gembalaku." /tmp/edge-id.mp3
          synthesize en-US-JennyNeural "The Lord is my shepherd." /tmp/edge-en.mp3
          synthesize zh-CN-XiaoxiaoNeural "神是我的牧者。" /tmp/edge-zh.mp3
