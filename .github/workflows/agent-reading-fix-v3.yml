name: Agent reading UX implementation v3

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-reading-fix-v3.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply reading UX and final Sauh centering patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(".github/workflows/agent-reading-fix.yml").read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          exec(compile(textwrap.dedent(workflow[start:end]), "reading-patch", "exec"), {})

          styles = Path("apps/web/src/styles.css")
          text = styles.read_text()
          old = '''.verse-panel:has(.sauh-skeleton) {\n  display: flex;\n  flex-direction: column;\n}\n\n.verse-panel:has(.sauh-skeleton) .sauh-skeleton {\n  flex: 1 1 auto;\n  min-height: clamp(220px, 34vh, 420px);\n  margin: 0;\n  padding: 24px 0;\n}'''
          new = '''.verse-panel:has(.sauh-skeleton) {\n  position: relative;\n}\n\n.verse-panel:has(.sauh-skeleton) .sauh-card-content {\n  position: static;\n}\n\n.verse-panel:has(.sauh-skeleton) .sauh-skeleton {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  min-height: 0;\n  margin: 0;\n  padding: 24px;\n  justify-content: center;\n}'''
          if text.count(old) != 1:
              raise SystemExit("Sauh flex override not found exactly once")
          text = text.replace(old, new, 1)
          mobile = '''\n\n  .verse-panel:has(.sauh-skeleton) .sauh-skeleton {\n    min-height: clamp(170px, 28vh, 280px);\n  }'''
          if text.count(mobile) != 1:
              raise SystemExit("Sauh mobile override not found exactly once")
          styles.write_text(text.replace(mobile, "", 1))

          app = Path("apps/web/src/App.tsx")
          source = app.read_text()
          old_home = 'to={`/literatur/${encodeURIComponent(item.id)}`}'
          new_home = 'to={`/literatur/${encodeURIComponent(item.id)}${item.format === "pdf" || item.format === "issue" ? "?read=1" : ""}`}'
          if source.count(old_home) != 1:
              raise SystemExit(f"Expected one home literature link, got {source.count(old_home)}")
          app.write_text(source.replace(old_home, new_home, 1))
          PY
      - name: Format changed source
        run: pnpm exec prettier --write apps/web/src/App.tsx apps/web/src/literature.tsx apps/web/src/faith.tsx apps/web/src/more.tsx apps/web/src/styles.css
      - name: Verify all code gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Verify focused browser behavior
        run: |
          pnpm --filter @gys/web exec playwright install --with-deps chromium
          pnpm --filter @gys/web exec playwright test e2e/reading-direct-flow.spec.ts --project=chromium
      - name: Commit verified implementation and remove temporary harnesses
        run: |
          git config user.name "gysapp-agent"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/agent-reading-fix.yml .github/workflows/agent-reading-fix-v2.yml .github/workflows/agent-reading-fix-v3.yml .github/workflows/agent-sauh-diagnostic.yml
          git add apps/web/src/App.tsx apps/web/src/literature.tsx apps/web/src/faith.tsx apps/web/src/more.tsx apps/web/src/styles.css
          git commit -m "feat: streamline resumable reading flows"
          git push origin HEAD:audit/parity-ui-tts-20260911
