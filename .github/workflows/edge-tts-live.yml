name: Edge TTS Live

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/edge-direct.ts"
      - "apps/web/src/edge-direct-safe.ts"
      - "apps/web/src/edge-speech.ts"
      - "apps/web/src/edge-direct*.test.ts"
      - "scripts/edge-tts-live-smoke.mjs"
      - ".github/workflows/edge-tts-live.yml"

permissions:
  contents: read

concurrency:
  group: edge-tts-live-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-keyless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture canonical Prettier output
        run: |
          pnpm exec prettier scripts/edge-tts-live-smoke.mjs --write
          node -e "console.log('FORMATTED_SMOKE_BASE64=' + require('node:fs').readFileSync('scripts/edge-tts-live-smoke.mjs').toString('base64'))"
      - name: Synthesize Indonesian speech without an API key
        run: node scripts/edge-tts-live-smoke.mjs
