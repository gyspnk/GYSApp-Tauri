name: Edge TTS Live

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/edge-direct.ts"
      - "apps/web/src/edge-direct-safe.ts"
      - "apps/web/src/edge-speech.ts"
      - "apps/web/src/edge-direct*.test.ts"
      - "scripts/edge-tts-live-smoke.mjs"
      - ".github/workflows/edge-tts-live.yml"

permissions:
  contents: read

concurrency:
  group: edge-tts-live-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-keyless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # This probes a third-party endpoint. Microsoft answered the handshake with
    # HTTP 403 for every Edge build we tried (B-35), so a red run here would
    # only ever report that outage and hide real regressions in the branches
    # that do gate on our code. The probe still runs, and its failure is
    # surfaced in the run summary instead of blocking the pull request.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Synthesize Indonesian speech without an API key
        id: smoke
        run: node scripts/edge-tts-live-smoke.mjs
      - name: Record the live probe result
        if: always()
        run: |
          if [ "${{ steps.smoke.outcome }}" = "success" ]; then
            echo "Edge TTS live probe passed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Edge TTS live probe failed - upstream handshake refused (tracked as B-35)." >> "$GITHUB_STEP_SUMMARY"
          fi
