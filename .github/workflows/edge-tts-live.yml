name: Edge TTS Live

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/web/src/edge-direct.ts"
      - "apps/web/src/edge-direct-safe.ts"
      - "apps/web/src/edge-speech.ts"
      - "apps/web/src/edge-direct*.test.ts"
      - "scripts/edge-tts-live-smoke.mjs"
      - ".github/workflows/edge-tts-live.yml"

permissions:
  contents: read

concurrency:
  group: edge-tts-live-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  live-keyless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # This probes a third-party endpoint. B-35 (Microsoft answered 403 for
    # every Edge build) is fixed by the version-2 Sec-MS-GEC token, and the
    # Worker now relays the same handshake for the web, so both probes run.
    # They stay continue-on-error because an upstream outage must not hide a
    # real regression in the branches that gate on our code.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Synthesize Indonesian speech without an API key
        id: smoke
        run: pnpm tts:live
      - name: Synthesize through the deployed Worker relay
        id: relay
        if: always()
        run: |
          body='{"text":"Pujilah Allah yang Maha Esa","voice":"id-ID-GadisNeural"}'
          code=$(curl -sS -o relay.mp3 -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -H 'origin: https://gyspnk.github.io' \
            --data "$body" \
            https://gysapp-tauri-bff.pas-presensi.workers.dev/api/v1/tts/edge)
          bytes=$(wc -c < relay.mp3)
          echo "relay http=$code bytes=$bytes"
          test "$code" = 200
          test "$bytes" -gt 2000

      - name: Record the live probe result
        if: always()
        run: |
          echo "Direct handshake: ${{ steps.smoke.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker relay: ${{ steps.relay.outcome }}" >> "$GITHUB_STEP_SUMMARY"
