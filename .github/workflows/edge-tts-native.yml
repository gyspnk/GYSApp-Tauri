name: Edge TTS Native

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/native/**"
      - "apps/web/src/edge-direct*.ts"
      - "apps/web/src/edge-speech.ts"
      - "apps/web/src/speech-player.ts"
      - "apps/web/scripts/edge-tts-native-smoke.mjs"
      - "apps/web/package.json"
      - ".github/workflows/edge-tts-native.yml"

permissions:
  contents: read

concurrency:
  group: edge-tts-native-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  packaged-native-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - name: Build the packaged Tauri executable
        run: pnpm --filter @gys/native exec tauri build --no-bundle
      - name: Exercise keyless Edge through WebView2 and the Tauri plugin
        run: pnpm --filter @gys/web test:e2e:native-edge
