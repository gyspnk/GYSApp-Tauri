name: Agent More section deep link

on:
  pull_request:
    paths:
      - "apps/web/e2e/more-section-deeplink.spec.ts"
      - "apps/web/src/calm-liturgical.css"
      - ".github/workflows/agent-more-section-red.yml"

permissions:
  contents: read

jobs:
  more-section:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Run More section deep-link contract
        run: pnpm --filter @gys/web exec playwright test e2e/more-section-deeplink.spec.ts
