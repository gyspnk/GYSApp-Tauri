name: CI

on:
  push:
    # Feature branches are verified by the pull_request event. Running both
    # events for the same SHA creates a cancelled duplicate check that can
    # incorrectly block an otherwise green PR.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older verification run while the PR event
  # remains the single source of truth for feature branches.
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:generated
      - run: pnpm verify:docs
      - run: pnpm format:check
      # Keep this job compile-free so it returns cheap structural feedback in
      # parallel. The e2e job builds the workspace once, then runs every unit
      # suite against those outputs before browser verification.
      - run: pnpm audit --prod

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck once
        run: pnpm build
      - name: Run unit and policy suites against the built workspace
        run: pnpm test
      - run: pnpm verify:native-assets
      - run: pnpm verify:bundle
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Run full browser suite against the prebuilt app
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web test:e2e
      - name: Upload browser diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact

  native-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Formatting does not need dependency artifacts. Fail here before paying
      # the ~20s warm-cache restore cost when a Rust file only needs rustfmt.
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
      - name: Restore Rust dependency and target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
          # The v2 namespace was populated only from a fully successful job.
          # A warm restore cuts native verification from ~7m10s to ~2m20s.
          shared-key: native-windows-v2
          cache-on-failure: false
      # cargo test compiles the native test targets and clippy --all-targets
      # performs the static compile/lint pass. A separate cargo check repeated
      # the dev-profile compilation (~42s on the measured warm run).
      - run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets -- -D warnings
