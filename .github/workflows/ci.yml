name: CI

on:
  push:
    # Feature branches are verified by the pull_request event. Running both
    # events for the same SHA creates a cancelled duplicate check that can
    # incorrectly block an otherwise green PR.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older verification run while the PR event
  # remains the single source of truth for feature branches.
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:generated
      - run: pnpm verify:docs
      - run: pnpm format:check
      # Keep this job compile-free so it returns cheap structural feedback in
      # parallel. Browser verification consumes one separately verified build.
      - run: pnpm audit --prod

  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck once
        run: pnpm build
      - name: Run unit and policy suites against the built workspace
        run: pnpm test
      - run: pnpm verify:native-assets
      - run: pnpm verify:bundle
      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: |
            apps/web/dist
            apps/bff/dist
            packages/contracts/dist
            packages/domain/dist
            packages/testkit/dist
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .
      # CI runs Chromium headlessly, so downloading the full headed Chromium
      # bundle is redundant. Keep system dependencies while installing only the
      # headless shell actually used by Playwright.
      - run: pnpm --filter @gys/web exec playwright install --with-deps --only-shell chromium
      - name: Run full browser shard ${{ matrix.shard }}/2
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/2
      - name: Upload shard diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}-failures-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore

  # Preserve the stable e2e check name for branch protection while the actual
  # full suite runs in two measured, deterministic shards above.
  e2e:
    if: ${{ always() }}
    needs: e2e-shard
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every browser shard to pass
        run: test "${{ needs.e2e-shard.result }}" = "success"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact

  native-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Formatting does not need dependency artifacts. Fail here before paying
      # the warm-cache restore cost when a Rust file only needs rustfmt.
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
      - name: Restore Rust dependency and target cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
          shared-key: native-windows-v2
          cache-on-failure: false
      # A full cache hit already contains the registry data required by the
      # lockfile. Avoid refreshing crates.io on every run; cold/partial caches
      # fetch once before switching the compile/test steps to deterministic
      # offline mode.
      - name: Fetch locked Rust dependencies on cache miss
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: cargo fetch --manifest-path apps/native/src-tauri/Cargo.toml --locked
      - name: Run native unit tests from the locked cache
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml --lib --locked --offline
      - name: Run native clippy from the locked cache
        run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets --locked --offline -- -D warnings
