name: CI

on:
  push:
    # Feature branches are verified by the pull_request event. Running both
    # events for the same SHA creates a cancelled duplicate check that can
    # incorrectly block an otherwise green PR.
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Strict navigation budgets run weekly instead of on every main push: the
  # hosted two-core runners cannot meet 1s/250ms, and a permanently red main
  # hides real regressions. The thresholds themselves are unchanged.
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read

concurrency:
  # A newer commit supersedes an older verification run while the PR event
  # remains the single source of truth for feature branches.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # One cheap classification job keeps the expensive jobs honest: a docs-only
  # push must not build the workspace, download a browser or boot three shards.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      web: ${{ steps.filter.outputs.web }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        name: Classify the pushed range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pr_base="${{ github.event.pull_request.base.sha }}"
          event_before="${{ github.event.before }}"
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          # Prefer the push range so a documentation push does not rebuild the
          # application. Opened or reopened pull requests have no previous head
          # and fall back to the PR base.
          if [ -n "$event_before" ] && [ "$event_before" != "0000000000000000000000000000000000000000" ]; then
            base="$event_before"
            range_kind="push"
          else
            base="$pr_base"
            range_kind="pr"
          fi
          if [ -z "$base" ]; then
            base=$(git rev-list --max-parents=0 HEAD)
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$base" || true
          fi
          files=$(git diff --name-only "$base" "$head" || git diff --name-only HEAD^ HEAD)
          # A cancelled or failed run must not be masked by a later docs push:
          # widen the range to everything since the last *successful* CI run on
          # this branch. When that lookup fails, verify (safe default).
          failed_lookup=false
          successful_head=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?branch=$branch&per_page=30" \
            | jq -r '[.workflow_runs[] | select(.name == "CI" and .status == "completed" and .conclusion == "success")][0].head_sha // ""' 2>/dev/null) || failed_lookup=true
          if [ "$failed_lookup" = "true" ]; then
            echo "Cannot read the last successful run: verifying the application."
            web_hint=true
          else
            web_hint=false
          fi
          if [ -z "${successful_head:-}" ]; then
            echo "No successful CI run on this branch yet: verifying the application."
            web_hint=true
          fi
          if [ -n "${successful_head:-}" ] && [ "$successful_head" != "$head" ]; then
            if ! git cat-file -e "$successful_head^{commit}" 2>/dev/null; then
              git fetch --no-tags --depth=1 origin "$successful_head" || true
            fi
            since=$(git diff --name-only "$successful_head" "$head" 2>/dev/null || true)
            if [ -n "$since" ]; then
              files="$since"
              range_kind="since-last-success"
            fi
          fi
          printf 'Range: %s (%s..%s)\nChanged files:\n%s\n' "$range_kind" "$base" "$head" "$files"
          web=$web_hint
          native=false
          if printf '%s\n' "$files" | grep -Eq '^(apps/(web|bff)/|packages/|scripts/|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig[^/]*\.json)'; then
            web=true
          fi
          if printf '%s\n' "$files" | grep -Eq '^apps/native/'; then
            native=true
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:generated
      - run: pnpm verify:docs
      - name: Check formatting with actionable diffs
        run: |
          if ! pnpm format:check; then
            pnpm exec prettier --write .
            git diff -- .
            exit 1
          fi
      # Keep this job compile-free so it returns cheap structural feedback in
      # parallel. Browser verification consumes one separately verified build.
      - run: pnpm audit --prod

  web-build:
    needs: changes
    if: ${{ github.event_name != 'workflow_dispatch' && needs.changes.result == 'success' && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck once
        run: pnpm build
      - name: Run unit and policy suites against the built workspace
        run: pnpm test
      - run: pnpm verify:native-assets
      - run: pnpm verify:bundle
      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: |
            apps/web/dist
            apps/bff/dist
            packages/contracts/dist
            packages/domain/dist
            packages/testkit/dist
          if-no-files-found: error
          retention-days: 1

  # Draft PRs need fast feedback while implementation is still moving. The
  # synchronize event supplies the prior head SHA, so ordinary pushes exercise
  # only the changed surface. Open/reopened draft PRs fall back to the PR base.
  e2e-selective:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft == true }}
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .
      # GitHub's Ubuntu image already carries Chromium runtime libraries. Avoid
      # Playwright's apt/font bootstrap and download only the headless browser
      # payload actually exercised by CI. The browser contract below proves the
      # runner remains sufficient on every image revision.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Run browser contracts affected by this draft update
        env:
          GYS_E2E_PREBUILT: "1"
          GYS_E2E_BASE: ${{ github.event.before || github.event.pull_request.base.sha }}
          GYS_E2E_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/test-e2e-selective.mjs --config=playwright.ci.config.ts
      - name: Upload selective browser diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-selective-failures-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Upload selective visual QA previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-selective-${{ github.run_id }}
          path: apps/web/test-results/ui-preview
          if-no-files-found: ignore
          retention-days: 7

  e2e-shard:
    if: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.draft == false) }}
    needs: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Three machines keep the full suite below the job budget even
        # when cold PDF/audio work contends on the hosted two-core runners.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .
      # CI runs Chromium headlessly. The hosted image already provides the
      # runtime libraries, so skip redundant apt/font installation and fetch
      # only the headless shell used by Playwright.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Run full browser shard ${{ matrix.shard }}/3
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test --config=playwright.ci.config.ts --shard=${{ matrix.shard }}/3
      - name: Upload shard diagnostics on failure
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}-failures-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore
      - name: Upload full-suite visual QA previews
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-full-${{ matrix.shard }}-${{ github.run_id }}
          path: apps/web/test-results/ui-preview
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the stable e2e check name for branch protection. Exactly one of
  # the two paths is expected to execute: selective for draft PRs, full shards
  # for ready PRs/main.
  e2e:
    if: ${{ always() }}
    needs: [changes, e2e-selective, e2e-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the applicable browser verification path to pass
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            echo "Manual/scheduled run: browser shards are not part of this workflow."
            exit 0
          fi
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "Change classification failed; refusing to skip browser verification."
            exit 1
          fi
          if [ "${{ needs.changes.outputs.web }}" != "true" ]; then
            echo "No web-affecting changes: browser verification is not applicable."
            exit 0
          fi
          if [ "${{ needs.e2e-selective.result }}" = "success" ] || [ "${{ needs.e2e-shard.result }}" = "success" ]; then
            exit 0
          fi
          echo "Neither selective nor full browser verification succeeded."
          exit 1

  # Sub-second warm-navigation budgets are measured on main pushes (or by
  # hand). Hosted pull-request runners cannot meet them — the same two cases
  # fail on the 8-core ARM host — so they no longer turn every PR shard red.
  perf-budget:
    if: ${{ github.event_name == 'schedule' && needs.changes.outputs.web == 'true' }}
    needs: [changes, web-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Measure the warm-navigation budgets
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test e2e/instant-navigation.spec.ts --grep @perf --workers=2 --retries=0

  # The `-linux` visual baselines must be regenerated on the hosted renderer
  # whenever a UI change is intentional. This manual job uploads fresh
  # screenshots for review instead of committing them blindly.
  update-visual-baselines:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Regenerate the visual baselines
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts e2e/visual-reading.spec.ts e2e/visual-consistency-matrix.spec.ts --update-snapshots --workers=2 --retries=0
      - name: Upload the regenerated baselines for review
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: apps/web/e2e/**/*-snapshots
          if-no-files-found: error
          retention-days: 7

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        run: docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect --source=/repo --no-banner --redact

  native-check:
    needs: changes
    if: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.result == 'success' && needs.changes.outputs.native == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Formatting does not need dependency artifacts. Fail here before paying
      # the warm-cache restore cost when a Rust file only needs rustfmt.
      - run: cargo fmt --manifest-path apps/native/src-tauri/Cargo.toml -- --check
      - name: Restore Rust dependency and target cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "apps/native/src-tauri -> target"
          shared-key: native-windows-v2
          cache-on-failure: false
      # Keep Cargo locked for deterministic resolution. `--lib` avoids building
      # empty binary/doc-test targets during the unit pass, while clippy still
      # validates every native target. Do not force `--offline`: rust-cache can
      # restore compiled artifacts without every sparse-index entry Cargo needs.
      - name: Run native library tests
        run: cargo test --manifest-path apps/native/src-tauri/Cargo.toml --lib --locked
      - name: Run native clippy
        run: cargo clippy --manifest-path apps/native/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
