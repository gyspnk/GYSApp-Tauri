name: Kidung Contract Migration

on:
  push:
    branches:
      - ui/kidung-density-pass-20260913
    paths:
      - .github/workflows/kidung-contract-migration.yml

permissions:
  contents: write
  actions: read

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/kidung-density-pass-20260913
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Align stale Kidung E2E contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              hits = text.count(old)
              if hits != 1:
                  raise SystemExit(f"{path}: expected 1 match, found {hits}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          def replace_count(path: str, old: str, new: str, expected: int) -> None:
              file = Path(path)
              text = file.read_text()
              hits = text.count(old)
              if hits != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {hits}: {old[:80]!r}")
              file.write_text(text.replace(old, new))

          replace_once(
              "apps/web/e2e/direct-manipulation.spec.ts",
              'page.getByRole("button", { name: "Buka PDF" })',
              'page.getByRole("tab", { name: "PDF" })',
          )

          replace_once(
              "apps/web/e2e/distributed-assets.spec.ts",
              '  await page.getByRole("button", { name: "Koleksi" }).click();\n',
              '  await page.locator(\'summary[aria-label="Filter koleksi"]\').click();\n'
              '  const collectionPanel = page.locator(".kidung-mobile-filter-panel");\n'
              '  await expect(collectionPanel).toBeVisible();\n'
              '  await collectionPanel.locator(".control-select-trigger").click();\n',
          )

          media = "apps/web/e2e/media-load.spec.ts"
          replace_count(
              media,
              'page.getByRole("button", { name: "Buka PDF" })',
              'page.getByRole("tab", { name: "PDF" })',
              4,
          )
          replace_once(
              media,
              '  await page.locator(".hymn-reader-settings-summary").click();\n'
              '  await page.getByRole("button", { name: "Nada dasar" }).click();\n',
              '  await page.locator(".hymn-reader-settings-summary").click();\n'
              '  await page.locator(".hymn-music-settings > summary").click();\n'
              '  await page.getByRole("button", { name: "Nada dasar" }).click();\n',
          )
          replace_once(
              media,
              '  await page.getByRole("tab", { name: "PDF" }).click();\n'
              '  await page.getByRole("button", { name: "Berikutnya" }).click();\n\n'
              '  await expect(page).toHaveURL(/\\/kidung\\/hymn-002$/);',
              '  await page.getByRole("tab", { name: "PDF" }).click();\n'
              '  await page.getByRole("button", { name: "Kembali ke lirik" }).click();\n'
              '  await page.getByRole("button", { name: "Berikutnya" }).click();\n\n'
              '  await expect(page).toHaveURL(/\\/kidung\\/hymn-002$/);',
          )

          nav = "apps/web/e2e/navigation-layout.spec.ts"
          replace_once(
              nav,
              '    await expect(page.getByRole("button", { name: "Koleksi" })).toBeVisible();\n',
              '    await expect(\n'
              '      page.locator(\'summary[aria-label="Filter koleksi"]\'),\n'
              '    ).toBeVisible();\n',
          )
          replace_once(
              nav,
              '    await page.getByRole("button", { name: "Buka pencarian lagu" }).click();\n',
              '    await search.click();\n',
          )
          replace_count(
              nav,
              'page.getByRole("button", { name: "Buka PDF" })',
              'page.getByRole("tab", { name: "PDF" })',
              2,
          )
          replace_once(
              nav,
              '      page.locator(".hymn-detail-page .detail-actions .hymn-action"),\n'
              '    ).toHaveCount(3);',
              '      page.locator(".hymn-detail-page .detail-actions .hymn-action"),\n'
              '    ).toHaveCount(1);',
          )
          replace_once(
              nav,
              '    await page.locator(".hymn-reader-settings-summary").click();\n'
              '    await expect(page.getByText("SoundFont aktif")).toBeVisible();\n',
              '    await page.locator(".hymn-reader-settings-summary").click();\n'
              '    await page.locator(".hymn-music-settings > summary").click();\n'
              '    await expect(page.getByText("SoundFont aktif")).toBeVisible();\n',
          )

          replace_once(
              "apps/web/e2e/smoke.spec.ts",
              '  await expect(header.getByRole("button", { name: "Koleksi" })).toBeVisible();\n',
              '  await expect(\n'
              '    header.locator(\'summary[aria-label="Filter koleksi"]\'),\n'
              '  ).toBeVisible();\n',
          )

          replace_once(
              "apps/web/e2e/visual.spec.ts",
              'page.getByRole("button", { name: "Buka PDF" })',
              'page.getByRole("tab", { name: "PDF" })',
          )
          PY

      - name: Restore verified Kidung Linux baselines from full CI 573
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts/10320485502/zip > /tmp/kidung-failures.zip
          unzip -q /tmp/kidung-failures.zip -d /tmp/kidung-failures
          cp /tmp/kidung-failures/visual-kidung-390x844-visual-baseline-chromium/kidung-390x844-actual.png \
            apps/web/e2e/visual.spec.ts-snapshots/kidung-390x844-linux.png
          cp /tmp/kidung-failures/visual-reader-768x1024-visual-baseline-chromium/reader-768x1024-actual.png \
            apps/web/e2e/visual.spec.ts-snapshots/reader-768x1024-linux.png

      - name: Format and validate migration
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm exec prettier --write \
            apps/web/e2e/direct-manipulation.spec.ts \
            apps/web/e2e/distributed-assets.spec.ts \
            apps/web/e2e/media-load.spec.ts \
            apps/web/e2e/navigation-layout.spec.ts \
            apps/web/e2e/smoke.spec.ts \
            apps/web/e2e/visual.spec.ts
          pnpm exec prettier --check \
            apps/web/e2e/direct-manipulation.spec.ts \
            apps/web/e2e/distributed-assets.spec.ts \
            apps/web/e2e/media-load.spec.ts \
            apps/web/e2e/navigation-layout.spec.ts \
            apps/web/e2e/smoke.spec.ts \
            apps/web/e2e/visual.spec.ts
          git diff --check

      - name: Commit migration and remove helper workflow
        shell: bash
        run: |
          rm .github/workflows/kidung-contract-migration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "test: align Kidung full-suite contracts with new UI"
          git push origin HEAD:ui/kidung-density-pass-20260913
