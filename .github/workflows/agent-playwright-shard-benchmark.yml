name: Agent Playwright shard benchmark

on:
  pull_request:
    paths:
      - ".github/workflows/agent-playwright-shard-benchmark.yml"
      - "apps/web/playwright.parallel-benchmark.config.ts"

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and typecheck once
        run: pnpm build
      - name: Run unit and policy suites against the built workspace
        run: pnpm test
      - run: pnpm verify:native-assets
      - run: pnpm verify:bundle
      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: |
            apps/web/dist
            apps/bff/dist
            packages/contracts/dist
            packages/domain/dist
            packages/testkit/dist
          if-no-files-found: error
          retention-days: 1

  e2e-shard:
    needs: web-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: e2e-build-${{ github.run_id }}
          path: .
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Run balanced Playwright shard ${{ matrix.shard }}/2
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test --config=playwright.parallel-benchmark.config.ts --shard=${{ matrix.shard }}/2
      - name: Upload shard diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-shard-${{ matrix.shard }}-failures-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore
