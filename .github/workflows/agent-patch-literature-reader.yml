name: Agent patch literature reader

on:
  pull_request:
    paths:
      - ".github/workflows/agent-patch-literature-reader.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Wrap secondary reading actions in progressive disclosure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("apps/web/src/literature.tsx")
          text = path.read_text()
          old_open = '        <div className="literature-progress-actions">\n'
          new_open = '''        <details
            className="literature-reading-tools"
            open={!directRead || !isPdfItem}
          >
            <summary>Kelola kemajuan & offline</summary>
            <div className="literature-progress-actions">
          '''
          old_close = '        </div>\n        {readerError && (\n'
          new_close = '            </div>\n          </details>\n        {readerError && (\n'
          if text.count(old_open) != 1:
              raise SystemExit(f"expected exactly one progress-actions opening, found {text.count(old_open)}")
          if text.count(old_close) != 1:
              raise SystemExit(f"expected exactly one progress-actions closing boundary, found {text.count(old_close)}")
          text = text.replace(old_open, new_open, 1)
          text = text.replace(old_close, new_close, 1)
          path.write_text(text)
          PY
          pnpm exec prettier --write apps/web/src/literature.tsx
      - name: Commit reader refinement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/literature.tsx
          git diff --cached --check
          git commit -m "feat: prioritize literature reading content"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
