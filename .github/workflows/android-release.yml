name: Android release cadence

# Every 25 goal rounds the agent dispatches this workflow: it builds the arm64
# APK through native-android.yml, generates the changelog from git history since
# the previous release, attaches both to a GitHub Release, and publishes it.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (default: v0.1.0-preview.<YYYYMMDD>.<n>)"
        required: false
        default: ""
        type: string
      from:
        description: "First commit range base (default: latest published release tag)"
        required: false
        default: ""
        type: string
      draft:
        description: "Keep the release as a draft"
        required: false
        default: false
        type: boolean
      turn:
        description: "Goal round this release closes; the cadence gate refuses a release before nextDueTurn"
        required: true
        default: ""
        type: string
      force:
        description: "Publish even when the cadence gate says the release is not due yet"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

concurrency:
  group: android-release-cadence
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the release cadence
        run: |
          set -euo pipefail
          args=(--turn "${{ inputs.turn }}")
          if [ "${{ inputs.force }}" = "true" ]; then args+=(--force); fi
          node scripts/release-gate.mjs "${args[@]}"
      - name: Resolve the previous release and build the changelog
        id: notes
        run: |
          set -euo pipefail
          git fetch --tags --force
          from="${{ inputs.from }}"
          if [ -z "$from" ]; then
            # The cadence record is the base, not the newest release: the two once
            # disagreed and the changelog re-listed a shipped commit.
            from=$(node scripts/release-gate.mjs --base)
          fi
          if [ -z "$from" ]; then
            from=$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')
          fi
          existing=$(git tag --list 'v0.1.0-preview.*' | paste -sd, -)
          args=(--from "$from" --date "$(date -u +%Y-%m-%d)" --existing "$existing")
          if [ -n "${{ inputs.tag }}" ]; then args+=(--tag "${{ inputs.tag }}"); fi
          node scripts/release-notes.mjs "${args[@]}" > release.json
          tag=$(node -p "require('./release.json').tag")
          test -n "$tag"
          echo "GYS_RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          node - <<'NODE'
          const { readFileSync } = require('node:fs');
          const release = JSON.parse(readFileSync('release.json', 'utf8'));
          if (!/^v[0-9][A-Za-z0-9.-]+$/.test(release.tag)) throw new Error('Invalid tag');
          require('node:fs').writeFileSync('release-notes.md', `${release.notes}\n`);
          require('node:fs').writeFileSync(`CHANGELOG-${release.tag}.md`, `${release.notes}\n`);
          const counts = Object.entries(release.counts).map(([type, count]) => `- ${type}: ${count}`).join('\n');
          require('node:fs').writeFileSync(
            'release-summary.md',
            [`## ${release.tag}`, '', `Base: ${release.from ?? 'initial commit'}`, '', counts].join('\n'),
          );
          NODE
          cat release-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Create the draft release for this commit
        run: |
          set -euo pipefail
          if gh release view "$GYS_RELEASE_TAG" >/dev/null 2>&1; then
            # A draft left behind by a failed attempt for this same commit holds no
            # APK, so it is safe to clear and rebuild. Anything published, or a
            # draft pointing at another commit, is never touched.
            draft=$(gh release view "$GYS_RELEASE_TAG" --json isDraft --jq .isDraft)
            target=$(gh release view "$GYS_RELEASE_TAG" --json targetCommitish --jq .targetCommitish)
            apk=$(gh release view "$GYS_RELEASE_TAG" --json assets --jq '[.assets[].name | select(endswith(".apk"))] | length')
            if [ "$draft" = "true" ] && { [ "$target" = "$GITHUB_SHA" ] || [ "$apk" = "0" ]; }; then
              echo "Clearing the draft $GYS_RELEASE_TAG left by an earlier attempt (target=$target, apk assets=$apk)."
              gh release delete "$GYS_RELEASE_TAG" --yes --cleanup-tag
            else
              echo "Release $GYS_RELEASE_TAG already exists (draft=$draft, target=$target); refusing to overwrite."
              exit 1
            fi
          fi
          gh release create "$GYS_RELEASE_TAG" \
            --draft \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "GYSApp ${GYS_RELEASE_TAG#v}" \
            --notes-file release-notes.md
          gh release upload "$GYS_RELEASE_TAG" "CHANGELOG-${GYS_RELEASE_TAG}.md"
      - name: Dispatch the APK build for this commit
        run: |
          set -euo pipefail
          gh workflow run native-android.yml --ref main \
            -f ref="$GITHUB_SHA" -f release_tag="$GYS_RELEASE_TAG" \
            -f turn="${{ inputs.turn }}"
      - name: Wait for the APK build
        run: |
          set -euo pipefail
          run_id=""
          for attempt in $(seq 1 60); do
            run_id=$(gh run list --workflow native-android.yml --commit "$GITHUB_SHA" \
              --json databaseId,createdAt --jq 'sort_by(.createdAt) | reverse | .[0].databaseId // empty')
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          test -n "$run_id"
          echo "APK build: $run_id"
          for attempt in $(seq 1 90); do
            status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + " " + (.conclusion // "")')
            case "$status" in
              "completed success") break ;;
              "completed "*) echo "APK build ended: $status"; exit 1 ;;
            esac
            sleep 20
          done
          test "$status" = "completed success"
      - name: Verify the release assets and publish
        run: |
          set -euo pipefail
          apk_name=$(node scripts/release-asset-name.mjs --config apps/native/src-tauri/tauri.conf.json)
          assets=$(gh release view "$GYS_RELEASE_TAG" --json assets --jq '.assets[].name')
          echo "$assets"
          for required in \
            "$apk_name" \
            SHA256SUMS-android.txt \
            native-provenance-android.json \
            "CHANGELOG-${GYS_RELEASE_TAG}.md"; do
            grep -Fxq "$required" <<< "$assets" || { echo "Missing asset: $required"; exit 1; }
          done
          # The tag was created on the server moments ago by `gh release create`.
          git fetch --quiet --tags --force origin
          gh release download "$GYS_RELEASE_TAG" --pattern 'native-provenance-android.json' --dir verify-assets
          node -e "
            const provenance = require('./verify-assets/native-provenance-android.json');
            if (provenance.commit !== process.env.GITHUB_SHA) {
              throw new Error('Artifact source mismatch: ' + provenance.commit);
            }
            if (provenance.signing !== 'Android debug identity') {
              throw new Error('Unexpected signing identity: ' + provenance.signing);
            }
            const { execFileSync } = require('node:child_process');
            const tagCommit = execFileSync('git', ['rev-list', '-n', '1', process.env.GYS_RELEASE_TAG], { encoding: 'utf8' }).trim();
            if (tagCommit !== provenance.commit) {
              throw new Error('Tag ' + process.env.GYS_RELEASE_TAG + ' points at ' + tagCommit + ' but the APK came from ' + provenance.commit);
            }
          "
          if [ "${{ inputs.draft }}" = "true" ]; then
            echo "Draft requested; leaving $GYS_RELEASE_TAG as draft."
          else
            gh release edit "$GYS_RELEASE_TAG" --draft=false
          fi
          gh release view "$GYS_RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"
      - name: Record the cadence
        if: ${{ !inputs.draft }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          apk_name=$(node scripts/release-asset-name.mjs --config apps/native/src-tauri/tauri.conf.json)
          apk_bytes=$(gh release view "$GYS_RELEASE_TAG" --json assets \
            --jq ".assets[] | select(.name == \"$apk_name\") | .size")
          test -n "$apk_bytes"
          node scripts/release-cadence-write.mjs \
            --turn "${{ inputs.turn }}" \
            --tag "$GYS_RELEASE_TAG" \
            --commit "$GITHUB_SHA" \
            --apk-bytes "$apk_bytes" \
            --run "$GITHUB_RUN_ID" \
            --url "$(gh release view "$GYS_RELEASE_TAG" --json url --jq .url)" \
            --signing "Android debug identity"
          node scripts/release-history-row.mjs \
            --turn "${{ inputs.turn }}" \
            --tag "$GYS_RELEASE_TAG" \
            --apk-bytes "$apk_bytes" \
            --run "$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA" \
            --note "putaran ${{ inputs.turn }}, signing debug" \
            --file docs/plans/release-cadence.md \
            --write
          git add .github/release-cadence.json docs/plans/release-cadence.md
          git commit -m "chore(release): record the turn-${{ inputs.turn }} cadence"
          git push origin HEAD:main
