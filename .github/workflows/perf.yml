name: Perf baseline

# The owner capped this device at running the web server only, so route timing
# is measured on the hosted runner. Dispatch with the commit you want measured
# (defaults to the branch tip) and compare the printed rows before/after a
# change instead of guessing from screenshots.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or branch to measure
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref_name }}-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  route-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # An older commit is often only reachable through history, and a
          # short SHA cannot be fetched from a depth-1 clone.
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the app once
        run: pnpm build
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Measure the primary routes
        env:
          GYS_E2E_PREBUILT: "1"
        # Without pipefail the tee exit code hid a failing measurement step,
        # so a broken perf test still showed the job green.
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @gys/web exec playwright test \
            e2e/runtime-performance-baseline.spec.ts \
            --grep "performance baseline" --workers=1 --retries=0 2>&1 | tee perf.log
      - name: Summarise the rows
        if: always()
        run: node scripts/perf-summary.mjs perf.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-log-${{ github.run_id }}
          path: perf.log
          retention-days: 5
