name: Agent format CI velocity scripts

on:
  pull_request:
    paths:
      - "scripts/prepush-plan.test.mjs"
      - "scripts/test-e2e-selective-core.mjs"
      - ".github/workflows/agent-format-ci-velocity.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format velocity scripts
        run: pnpm exec prettier --write scripts/prepush-plan.test.mjs scripts/test-e2e-selective-core.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/prepush-plan.test.mjs scripts/test-e2e-selective-core.mjs
          git commit -m "chore: format CI velocity scripts"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
