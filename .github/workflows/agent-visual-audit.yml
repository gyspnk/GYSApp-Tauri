name: Agent visual baseline acceptance

on:
  push:
    branches:
      - audit/parity-ui-tts-20260911
    paths:
      - ".github/workflows/agent-visual-audit.yml"

permissions:
  contents: write

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/parity-ui-tts-20260911
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Update inspected visual baselines
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts --project=chromium --update-snapshots --reporter=line
      - name: Guard accepted snapshot set
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git diff --name-only -- apps/web/e2e/visual.spec.ts-snapshots | sort)"
          expected="$(printf '%s\n' \
            apps/web/e2e/visual.spec.ts-snapshots/bible-1440x900-linux.png \
            apps/web/e2e/visual.spec.ts-snapshots/bible-768x1024-linux.png \
            apps/web/e2e/visual.spec.ts-snapshots/home-1440x900-linux.png \
            apps/web/e2e/visual.spec.ts-snapshots/kidung-1440x900-linux.png \
            apps/web/e2e/visual.spec.ts-snapshots/kidung-390x844-linux.png \
            apps/web/e2e/visual.spec.ts-snapshots/kidung-768x1024-linux.png | sort)"
          printf 'Changed snapshots:\n%s\n' "$actual"
          test "$actual" = "$expected"
          git diff --check
      - name: Re-run visual gate against accepted baselines
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts --project=chromium --reporter=line
      - name: Commit verified baselines
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots
          git commit -m "test: accept inspected visual baselines"
          git push origin HEAD:audit/parity-ui-tts-20260911
