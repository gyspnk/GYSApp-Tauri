name: Agent visual review

on:
  pull_request:
    paths:
      - "apps/web/src/**"
      - "apps/web/e2e/visual.spec.ts"
      - "apps/web/e2e/visual-reading.spec.ts"
      - ".github/workflows/agent-visual-review.yml"

permissions:
  contents: read

jobs:
  visual-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build once for visual review
        run: pnpm build
      - run: pnpm --filter @gys/web exec playwright install --with-deps chromium
      - name: Render current visual contract
        env:
          GYS_E2E_PREBUILT: "1"
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts e2e/visual-reading.spec.ts --update-snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calm-ui-reviewed-candidates-${{ github.run_id }}
          path: |
            apps/web/e2e/visual.spec.ts-snapshots/*.png
            apps/web/e2e/visual-reading.spec.ts-snapshots/*.png
            apps/web/test-results/**/*.png
          if-no-files-found: error
