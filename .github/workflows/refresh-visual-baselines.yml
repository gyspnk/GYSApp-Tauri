name: Refresh visual baselines once

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Check one-shot marker
        id: marker
        shell: bash
        run: |
          if [ -f .github/refresh-visual-baselines.once ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.marker.outputs.enabled == 'true'
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        if: steps.marker.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install workspace
        if: steps.marker.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Install Chromium shell
        if: steps.marker.outputs.enabled == 'true'
        run: pnpm --filter @gys/web exec playwright install --only-shell chromium
      - name: Refresh Linux visual baselines
        if: steps.marker.outputs.enabled == 'true'
        run: pnpm --filter @gys/web exec playwright test e2e/visual.spec.ts --config=playwright.ci.config.ts --update-snapshots
      - name: Commit refreshed baselines
        if: steps.marker.outputs.enabled == 'true'
        shell: bash
        run: |
          rm .github/refresh-visual-baselines.once
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual.spec.ts-snapshots/*-linux.png .github/refresh-visual-baselines.once
          if git diff --cached --quiet; then
            echo "No visual baseline changes to commit."
            exit 0
          fi
          git commit -m "test(ui): refresh approved Linux visual baselines"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
