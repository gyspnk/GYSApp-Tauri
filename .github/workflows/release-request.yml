name: Requested native release

on:
  push:
    branches: [main]
    paths: [.github/release-request.json]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: requested-native-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate the explicit release request
        id: request
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const request = JSON.parse(fs.readFileSync('.github/release-request.json', 'utf8'));
          if (!/^v[0-9][A-Za-z0-9.-]+$/.test(request.tag) || typeof request.notes !== 'string') throw new Error('Invalid release request');
          fs.appendFileSync(process.env.GITHUB_ENV, `GYS_RELEASE_TAG=${request.tag}\n`);
          fs.writeFileSync('release-notes.md', request.notes);
          NODE
          GYS_RELEASE_TAG=$(node -p "JSON.parse(require('node:fs').readFileSync('.github/release-request.json', 'utf8')).tag")
          turn=$(node scripts/release-gate.mjs --due)
          echo "GYS_RELEASE_TURN=$turn" >> "$GITHUB_ENV"
          if state=$(gh release view "$GYS_RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [ "$state" = "false" ]; then
              echo "::notice::$GYS_RELEASE_TAG is already published; the request is a no-op."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          base=$(node scripts/release-gate.mjs --base)
          if [ -n "$base" ] && [ "$(printf '%s\n%s\n' "$base" "$GYS_RELEASE_TAG" | LC_ALL=C sort | head -n 1)" = "$GYS_RELEASE_TAG" ]; then
            echo "::notice::$GYS_RELEASE_TAG is not after the cadence's last release $base; the request is a no-op."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # This path has no turn input, so it uses the due turn from the cadence
          # rather than building an APK whose versionCode was never raised.
          node scripts/release-gate.mjs --turn "$turn"
          if ! gh release view "$GYS_RELEASE_TAG" --json isDraft > release-state.json; then
            gh release create "$GYS_RELEASE_TAG" --draft --prerelease --target "$GITHUB_SHA" --title "$GYS_RELEASE_TAG" --notes-file release-notes.md
            gh release view "$GYS_RELEASE_TAG" --json isDraft > release-state.json
          fi
          node -e "if (JSON.parse(require('node:fs').readFileSync('release-state.json', 'utf8')).isDraft !== true) throw new Error('Refusing to overwrite a published release')"
          gh release edit "$GYS_RELEASE_TAG" --target "$GITHUB_SHA"
      - name: Dispatch both builds from this exact commit
        if: steps.request.outputs.skip != 'true'
        run: |
          test "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA"
          gh workflow run native-android.yml --ref main -f ref="$GITHUB_SHA" -f release_tag="$GYS_RELEASE_TAG" -f turn="$GYS_RELEASE_TURN"
          gh workflow run native-windows.yml --ref main -f ref="$GITHUB_SHA" -f signed=false -f release_tag="$GYS_RELEASE_TAG"
      - name: Wait for native packaging, Android runtime, and CI
        if: steps.request.outputs.skip != 'true'
        run: |
          set -euo pipefail
          for workflow in native-android.yml native-windows.yml ci.yml; do
            run_id=""
            for attempt in $(seq 1 30); do
              run_id=$(gh run list --workflow "$workflow" --commit "$GITHUB_SHA" --json databaseId --jq '.[0].databaseId // empty')
              if [ -n "$run_id" ]; then break; fi
              sleep 2
            done
            test -n "$run_id"
            gh run watch "$run_id" --interval 20 --exit-status
          done
      - name: Verify the downloaded release assets and publish
        if: steps.request.outputs.skip != 'true'
        run: |
          set -euo pipefail
          gh release download "$GYS_RELEASE_TAG" --dir release-assets
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const crypto = require('node:crypto');
          const lines = [];
          for (const [platform, provenance] of [['android','native-provenance-android.json'],['windows','native-provenance.json']]) {
            const metadata = JSON.parse(fs.readFileSync(path.join('release-assets', provenance), 'utf8'));
            if (metadata.commit !== process.env.GITHUB_SHA) throw new Error('Artifact source mismatch');
            const checksums = fs.readFileSync(`release-assets/SHA256SUMS-${platform}.txt`, 'utf8');
            for (const line of checksums.trim().split('\n')) {
              const match = line.match(/^([a-f0-9]{64})\s+\*?(.+)$/);
              if (!match) throw new Error('Invalid checksum manifest');
              const filename = path.basename(match[2].trim());
              const bytes = fs.readFileSync(path.join('release-assets', filename));
              if (crypto.createHash('sha256').update(bytes).digest('hex') !== match[1]) throw new Error('Artifact checksum mismatch');
              if (bytes.length !== metadata.artifactBytes) throw new Error('Artifact byte count mismatch');
              lines.push(`- ${filename}: ${bytes.length.toLocaleString('en-US')} bytes, SHA256 verified.`);
            }
          }
          fs.appendFileSync('release-notes.md', `\n\nSource: ${process.env.GITHUB_SHA}.\n\n${lines.join('\n')}\n\nCI and Android 17 runtime checks passed. Preview Android signing; Windows installer remains unsigned.\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
          gh release edit "$GYS_RELEASE_TAG" --notes-file release-notes.md --draft=false
