<a class="skip" href="#content">Lewati ke konten</a>
<header class="site-head"><div class="head-inner"><span class="wordmark">GYSApp</span><span class="section-name">Suara Sejati</span></div></header>
<main id="content"><div class="container" id="listing">
<section class="intro"><p class="kicker">Suara Sejati</p><h1>Suara</h1><p class="intro-copy">Kesaksian dan pengajaran.</p></section>
<section class="filter-area" aria-label="Filter konten">
<div class="search-field"><label for="search">Cari di Suara</label><div class="search-box"><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><input id="search" type="search" placeholder="Cari kesaksian…" autocomplete="off"></div></div>
<div><p class="group-label" id="category-label">Kategori</p><div class="chips" role="group" aria-labelledby="category-label"><button type="button" aria-pressed="true" data-category="Semua">Semua</button><button type="button" aria-pressed="false" data-category="Kesaksian">Kesaksian</button><button type="button" aria-pressed="false" data-category="Pengajaran">Pengajaran</button></div></div>
<div class="sort-field"><label for="sort">Urutkan</label><select id="sort"><option value="newest">Terbaru</option><option value="oldest">Terlama</option></select></div>
</section>
<div class="results-head"><p id="count" role="status" aria-live="polite">— hasil</p><span class="placeholder-label">Contoh tata letak</span></div>
<section id="posts" class="post-list" aria-label="Daftar Suara"></section>
<section id="loading" class="post-list" aria-label="Memuat konten" aria-busy="true" hidden></section>
<section id="empty" class="state" hidden><h2>Belum ada hasil</h2><p>Tidak ada konten yang sesuai dengan pencarian atau kategori ini. Coba kata lain atau hapus filter.</p><button type="button" id="clear">Hapus filter</button></section>
<section id="offline" class="state" role="alert" hidden><svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 3 18 18M2 8a17 17 0 0 1 3-2m4-1a17 17 0 0 1 13 3M5 12a11 11 0 0 1 4-2m5 0a11 11 0 0 1 5 2M8.5 15.5a5 5 0 0 1 7 0"/><circle cx="12" cy="19" r=".5"/></svg><h2>Koneksi terputus</h2><p>Konten belum dapat dimuat. Periksa koneksi internet, lalu coba lagi.</p><button type="button" id="retry">Coba lagi</button></section>
</div>
<section class="reader" id="reader" aria-label="Pembaca dalam aplikasi" hidden><button type="button" class="back" id="back">← Kembali ke Suara</button><p class="category" id="reader-category"></p><h2 id="reader-title" tabindex="-1"></h2><p class="date">[Tanggal terbit]</p><p id="reader-excerpt"></p><p class="reader-note">Ini adalah pratinjau pembaca. Konten asli belum disertakan; tidak ada isi artikel yang dibuat untuk contoh ini.</p></section>
</main>
<script-placeholder>
(()=>{
const settings=JSON.parse(document.documentElement.dataset.settings||'{}');document.documentElement.dataset.theme=settings.theme||'light';
const $=s=>document.querySelector(s);const chips=[...document.querySelectorAll('[data-category]')];
// Layout fixtures only. No published posts, dates, authors, or audio metadata.
const samples=Array.from({length:6},(_,i)=>({id:'layout-'+i,category:i%3===1?'Pengajaran':'Kesaksian',title:i%3===1?'[Judul pengajaran]':'[Judul kesaksian]',excerpt:i%3===1?'[Cuplikan pengajaran ditampilkan di sini, sepanjang dua hingga tiga baris.]':'[Cuplikan kesaksian ditampilkan di sini, sepanjang dua hingga tiga baris.]'}));
let category='Semua',mode=settings.state||'list',lastId=null,scroll=0;
const arrow='<svg class="od-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg>';
function render(){
const query=$('#search').value.trim().toLocaleLowerCase('id');let items=samples.filter(p=>(category==='Semua'||category===p.category)&&[p.title,p.excerpt,p.category].join(' ').toLocaleLowerCase('id').includes(query));
// Dates were not supplied: sort choice is retained, but never fabricate chronology.
$('#posts').replaceChildren();const isEmpty=mode==='empty'||(mode==='list'&&!items.length);
$('#posts').hidden=mode!=='list'||isEmpty;$('#empty').hidden=!isEmpty;$('#offline').hidden=mode!=='offline';$('#loading').hidden=mode!=='loading';
$('#count').textContent=mode==='loading'?'Memuat…':mode==='offline'?'Konten belum tersedia':isEmpty?'0 hasil':'— hasil';
chips.forEach(c=>c.setAttribute('aria-pressed',String(c.dataset.category===category)));
if(mode==='list'&&!isEmpty)items.forEach(p=>{const article=document.createElement('article');article.className='post';article.innerHTML='<p class="category"></p><h2 class="od-clamp-2"></h2><p class="excerpt od-clamp-3"></p><div class="post-bottom"><span class="date">[Tanggal terbit]</span><a class="read" href="#reader">Baca '+arrow+'</a></div>';article.querySelector('.category').textContent=p.category;article.querySelector('h2').textContent=p.title;article.querySelector('.excerpt').textContent=p.excerpt;const link=article.querySelector('a');link.dataset.id=p.id;link.setAttribute('aria-label','Baca '+p.title);$('#posts').append(article)});
}
$('#loading').innerHTML=Array.from({length:6},()=>'<div class="skeleton" aria-hidden="true"><span class="bone short"></span><span class="bone heading"></span><span class="bone"></span><span class="bone"></span><span class="bone medium"></span><span class="bone short"></span></div>').join('');
chips.forEach(c=>c.addEventListener('click',()=>{category=c.dataset.category;if(mode==='empty')mode='list';render()}));$('#search').addEventListener('input',()=>{if(mode==='empty')mode='list';render()});$('#sort').addEventListener('change',render);
$('#clear').addEventListener('click',()=>{$('#search').value='';category='Semua';mode='list';render();$('#search').focus()});
$('#retry').addEventListener('click',()=>{mode='loading';render();setTimeout(()=>{mode=navigator.onLine?'list':'offline';render()},700)});
$('#posts').addEventListener('click',event=>{const link=event.target.closest('a[data-id]');if(!link)return;event.preventDefault();const p=samples.find(p=>p.id===link.dataset.id);lastId=p.id;scroll=window.scrollY;$('#reader-category').textContent=p.category;$('#reader-title').textContent=p.title;$('#reader-excerpt').textContent=p.excerpt;$('#listing').hidden=true;$('#reader').hidden=false;window.scrollTo(0,0);$('#reader-title').focus()});
$('#back').addEventListener('click',()=>{$('#reader').hidden=true;$('#listing').hidden=false;window.scrollTo(0,scroll);const link=[...document.querySelectorAll('a[data-id]')].find(l=>l.dataset.id===lastId);(link||$('#search')).focus({preventScroll:true})});
render();
})();
</script-placeholder>
</body></html>
</script>
<script>
(()=>{
const params=new URLSearchParams(location.search);const themes=['light','dark','sepia','amoled'];const states=['list','loading','empty','offline'];const theme=themes.includes(params.get('theme'))?params.get('theme'):'light';const state=states.includes(params.get('state'))?params.get('state'):'list';document.documentElement.dataset.theme=theme;
const settings=JSON.stringify({theme,state}).replace(/&/g,'&amp;').replace(/'/g,'&#39;');
const source=document.querySelector('#app').textContent.replace('<html lang="id" data-theme="light">',`<html lang="id" data-theme="${theme}" data-settings='${settings}'>`).replaceAll('<script-placeholder>','<scr'+'ipt>').replaceAll('</script-placeholder>','</scr'+'ipt>');
document.querySelectorAll('iframe').forEach(frame=>{frame.srcdoc=source});
const slot=document.querySelector('.desktop-slot'),frame=slot.querySelector('iframe');new ResizeObserver(()=>{const ratio=slot.clientWidth/1440;frame.style.zoom=ratio;slot.style.height=(900*ratio)+'px'}).observe(slot);
})();
</script>
